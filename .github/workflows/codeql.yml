name: CodeQL

# Scans every push to development and main, every PR into either, and weekly so new queries run against code that
# has not changed. Needs no token. Turn off the CodeQL "default setup" under Settings > Code security, or the two conflict.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The self-hosted runners have no Node on PATH, and CodeQL's TypeScript extractor needs one.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # TypeScript needs no build, so no install either: CodeQL reads the source.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript
