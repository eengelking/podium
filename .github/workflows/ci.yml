name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 60 # three test attempts of up to 15 minutes, plus install and build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test (server, frontend, simulator, podiumctl)
        # A failed attempt is retried twice (scripts/ci-retry.sh), so a flaky test does not fail the PR; each retry leaves a warning.
        run: scripts/ci-retry.sh --name "Test" --timeout 15m -- npm test
        env:
          # This job has no database server. It says so, and the run prints that PostgreSQL and MariaDB were NOT RUN; the "Test with PostgreSQL"
          # and "Test with MariaDB 11.4" jobs below run them, and every adapter with a server has a job of its own, which a test in
          # server/src/storage/adapters.test.ts requires (#1008).
          PODIUM_TEST_ONLY: sqlite

      - name: Build (UI, server, scripts type-check)
        run: npm run build

      # The standards pages follow main, so development may be ahead of them. A PR into main (a release or a hotfix) and a push
      # to main must leave them identical to the app: docs/standards/ and the app agree on every token, class and component.
      - name: Standards match the app (PRs into main, and main)
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: npm run standards:parity

      # dist/ holds the built reporter and is tracked (#983). The marketplace installs it from main, so a PR into main (a release or a
      # hotfix) and a push to main must leave it exactly what a clean build of the source produces. Feature PRs into development never
      # touch it; release-prep rebuilds it with `npm run plugin:build:release`.
      - name: The tracked dist/ is the clean build of the source (PRs into main, and main)
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: npm run plugin:dist:check

  # The PostgreSQL adapter's tests (#822) need PODIUM_TEST_PG to name a server (the run fails without one unless it is limited with PODIUM_TEST_ONLY,
  # as `npm test` above is). This job gives them one: a service container with a health check, on a GitHub-hosted runner (the self-hosted runners above are containers on a shared
  # Podman host, where a service's published port is not reachable as localhost). Each test file makes and drops its own database, so
  # the one server serves them all. The service trusts connections (no password): it lives for one job and only the runner reaches it.
  test-postgres:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 40 # three test attempts of up to 10 minutes, plus install
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PODIUM_TEST_PG: postgres://postgres@localhost:5432/postgres
      # MariaDB runs in its own job below; this one says so, and the run prints that it was NOT RUN here.
      PODIUM_TEST_ONLY: sqlite,postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # The server's suite holds the adapter's tests and the scripts' tests (throwaway-db among them). The frontend's already ran above.
      - name: Test the server with PostgreSQL behind it
        run: scripts/ci-retry.sh --name "Test the server with PostgreSQL behind it" --timeout 10m -- npm test -w server

  # The MariaDB adapter's tests (#823), the same way as PostgreSQL's above: PODIUM_TEST_MARIADB names a service container on a GitHub-hosted
  # runner, and each test file makes and drops its own database on it. Podium supports MariaDB 11.x and tests one version, 11.4, the
  # long-term release scripts/db-adapters.mjs names (scripts/db-adapters.test.ts holds them together); other versions are untested. The
  # root password is empty: the service lives for one job and only the runner reaches it.
  test-mariadb:
    name: Test with MariaDB 11.4
    runs-on: ubuntu-latest
    timeout-minutes: 40 # three test attempts of up to 10 minutes, plus install
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: podium_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      PODIUM_TEST_MARIADB: mariadb://root@127.0.0.1:3306/podium_test
      # PostgreSQL runs in its own job above; this one says so, and the run prints that it was NOT RUN here.
      PODIUM_TEST_ONLY: sqlite,mariadb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test the server with MariaDB behind it
        run: scripts/ci-retry.sh --name "Test the server with MariaDB behind it" --timeout 10m -- npm test -w server

  # The reporters' shared code (#934). `npm test` above also runs these files through the server's config; this job runs them
  # on their own, with no harness CLI and no harness API types, which is how a change to plugin/core/ is judged for every harness.
  test-core:
    name: Test plugin/core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test plugin/core
        run: scripts/ci-retry.sh --name "Test plugin/core" --timeout 10m -- npm run test:core

  # The OpenCode reporter (#855). Its runner is vitest, run on the built dist/opencode, and its types are fetched by the typecheck
  # script (`@opencode/plugin`, installed once into .build-test/), so neither needs the OpenCode CLI.
  test-opencode:
    name: Test the OpenCode reporter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test the built OpenCode reporter
        run: scripts/ci-retry.sh --name "Test the built OpenCode reporter" --timeout 10m -- npm run test:mod:opencode

      - name: Type-check the OpenCode reporter
        run: scripts/ci-retry.sh --name "Type-check the OpenCode reporter" --timeout 10m -- npm run typecheck:mod:opencode

# Not run here: `test:mod:claudecode` and `typecheck:mod:claudecode`, which need Claude Code's CLI and its plugin API declarations,
# which the runners do not have. Run them locally when plugin/claudecode/ or plugin/core/ changes (CONTRIBUTING.md, "Testing a reporter").
