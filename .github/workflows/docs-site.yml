name: Docs site

# Builds the docs site (site/, built from docs/ by site/scripts/build.mjs) and publishes it to GitHub Pages at podium.engelking.dev.
#   - A push to main (a release or a hotfix) builds the site and deploys it.
#   - A PR into main (the release PR) builds it without deploying, so a broken link or a page that will not build fails the PR.
# Nothing runs on feature branches or on pushes to development. The build fails on a broken internal link.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    steps:
      # Every tag, because each older release line is built from its newest tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Build every version
        run: node site/scripts/build.mjs

      - name: Upload the site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ${{ fromJSON('["self-hosted","Linux","X64"]') }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
