name: Docs site

# Builds the docs site (site/, built from docs/ by site/scripts/build.mjs) and publishes it to GitHub Pages at podium.engelking.dev.
#   - A push to main (a release or a hotfix) builds the site and deploys it.
#   - A PR into main (the release PR) builds it without deploying, so a broken link or a page that will not build fails the PR.
#   - A PR into development builds it too, without deploying, when the PR changes something the site is made from: docs/, site/, the
#     app's tokens or this workflow. Any other PR skips the build.
# Nothing runs on pushes to development or to feature branches. The build fails on a broken internal link.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    steps:
      # Every tag, because each older release line is built from its newest tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # A PR into development builds the site only when it changes what the site is made from. Everything else always builds.
      - name: Decide whether the site could be affected
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "development" ]; then
            if git diff --name-only "origin/$BASE...HEAD" | grep -Eq '^(docs/|site/|frontend/src/fleet/tokens\.css$|\.github/workflows/docs-site\.yml$|package\.json$)'; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "This PR changes nothing the docs site is made from, so the site is not built."
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.gate.outputs.build == 'true'
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Build every version
        if: steps.gate.outputs.build == 'true'
        run: node site/scripts/build.mjs

      - name: Upload the site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ${{ fromJSON('["self-hosted","Linux","X64"]') }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
