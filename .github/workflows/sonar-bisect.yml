name: Sonar bisect (temporary, #501)
on:
  pull_request:
    branches: [development]
    paths: ['.github/workflows/sonar-bisect.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        group:
          - { n: main, inc: 'frontend/src/main.tsx' }
          - { n: setup, inc: 'frontend/src/setupTests.ts,frontend/src/jest-dom.d.ts' }
          - { n: route, inc: 'frontend/src/route.ts' }
          - { n: fe-root, inc: 'frontend/*.ts' }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.scanner.dumpToFile=/tmp/sonar-dump-${{ matrix.group.n }}.json
            -Dsonar.exclusions=mockup/**,docs/**,${{ matrix.group.inc }}
            -Dsonar.verbose=true
