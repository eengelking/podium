name: Plugin dist

# Publishes the built plugins (dist/claudecode/ and dist/opencode/ when it has a plugin.json) to the `plugin-dist` branch (#927).
# The `eengelking-marketplace` entry for podium-reporter points at that branch, so a release reaches an installed copy as a new
# commit there. `main` moves only on a release (CLAUDE.md, Branching Model), so a push to `main` is a release and this is what
# publishes it. The job installs, runs `npm test` and `npm run build`, builds every harness with scripts/plugin-build.mjs (which runs
# the self-containment check), and then runs scripts/plugin-publish.mjs. A failing step stops the job before anything is published,
# and the marketplace keeps serving the last good commit. All the publish rules live in that script and its tests, not here:
# it refuses a source ref other than `main` or `release-candidate/*`, checks the built version against the product version,
# commits on top of the branch (never a force-push), and publishes nothing when the tree is unchanged, so a rerun is safe.
# A `workflow_dispatch` workflow runs only from the default branch, so this file takes effect when it reaches `main`.
# To rerun it: Actions tab, "Plugin dist", "Run workflow", choose `main` (or a `release-candidate/*` branch to seed or test).
# The optional `target` input names a test branch to publish to instead of `plugin-dist`.
# Never from a pull request or a fork: only `push` to `main` and a manual run, and neither takes a fork's code.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'The branch to publish to (default plugin-dist). Use another name only to test.'
        required: false
        default: 'plugin-dist'

permissions:
  contents: read

# Two runs never publish at once. A queued run waits for the running one rather than cancelling it.
concurrency:
  group: plugin-dist
  cancel-in-progress: false

jobs:
  publish:
    # No fork path applies: push and workflow_dispatch only run on this repo (see ci.yml).
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TARGET: ${{ github.event.inputs.target || 'plugin-dist' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The job's token is what the publish step pushes with, so the credentials stay in the checkout's config.
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test (server, frontend, simulator, podiumctl, plugin)
        run: npm test

      - name: Build (UI, server, scripts type-check)
        run: npm run build

      - name: Build the plugins and check they are self-contained
        run: node scripts/plugin-build.mjs

      - name: Publish to the plugin-dist branch
        run: |
          set -euo pipefail
          node scripts/plugin-publish.mjs \
            --source-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF_NAME" \
            --target "$TARGET"
