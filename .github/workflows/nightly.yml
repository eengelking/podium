name: Nightly

# A daily snapshot of `development` for testers (#528). It publishes the tag `nightly-YYYY-MM-DD` and a GitHub prerelease that
# carries a source tarball of the tested commit and the two reporters' zips (#835, #857), then removes every earlier nightly, so one exists at a time. There is no registry.
# A `schedule:` trigger only runs from the workflow file on the default branch, so this file takes effect when it reaches `main`;
# it checks out `development` by name. The reporter's zip is built by the same scripts as a release's. A nightly never changes the tracked
# dist/ (#983): that holds a release's build and moves only with a merge to `main`. Run it by hand from the Actions tab with `workflow_dispatch`.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC every day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # The `gh` version each job installs (see "Install the GitHub CLI"). Bump it by hand when a newer release is wanted.
  GH_VERSION: '2.103.2'

jobs:
  test:
    # No fork path applies: a schedule only runs on this repo (see ci.yml).
    # A GitHub-hosted runner with a service container for each adapter's test server (#1178), the way sonar.yml's coverage job has them: the
    # self-hosted runners are containers on a shared Podman host, where a service's published port is not reachable as localhost. `npm test`
    # fails when an adapter's test server is not configured and PODIUM_TEST_ONLY is not set here on purpose: a nightly runs every adapter
    # (scripts/db-adapters.test.ts holds this file to scripts/db-adapters.mjs, so the next adapter fails `npm test` until it is added here).
    # The services have no password: they live for one job and only the runner reaches them.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: podium_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      PODIUM_TEST_PG: postgres://postgres@localhost:5432/postgres
      PODIUM_TEST_MARIADB: mariadb://root@127.0.0.1:3306/podium_test
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
      skip: ${{ steps.tip.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0

      - name: Install the GitHub CLI
        # The runners are generic and do not ship `gh` (#698). Each job installs it, with no sudo, from the pinned release
        # and its checksums file, and leaves a runner that already has one alone.
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          dir="${RUNNER_TEMP}/gh-cli"
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          rm -rf "$dir"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "${dir}/${archive}" "${base}/${archive}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "${dir}/checksums.txt" "${base}/gh_${GH_VERSION}_checksums.txt"
          (cd "$dir" && awk -v f="$archive" '$2 == f' checksums.txt | sha256sum -c -)
          tar -xzf "${dir}/${archive}" -C "$dir"
          echo "${dir}/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
          "${dir}/gh_${GH_VERSION}_linux_amd64/bin/gh" --version

      - name: Record the commit and check whether it already has a nightly
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building development at $sha"
          # Two statements, so a failing `gh` fails the step instead of leaving `current` empty behind a pipe.
          releases="$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("nightly-")) | .tagName')"
          current="${releases%%$'\n'*}"
          tagged=""
          if [ -n "$current" ]; then
            refs="$(git ls-remote origin "refs/tags/${current}^{}" "refs/tags/${current}")"
            tagged="$(printf '%s\n' "$refs" | tail -n 1 | cut -f1)"
          fi
          if [ -n "$current" ] && [ "$tagged" = "$sha" ]; then
            echo "$current already points at $sha; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.tip.outputs.skip != 'true'
        with:
          node-version: 26
          cache: npm

      - name: Install
        if: steps.tip.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Test (server, frontend, simulator, podiumctl)
        if: steps.tip.outputs.skip != 'true'
        run: npm test

      - name: Build (UI, server, scripts type-check)
        if: steps.tip.outputs.skip != 'true'
        run: npm run build

  publish:
    needs: test
    if: needs.test.outputs.skip != 'true'
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.test.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha }}
          fetch-depth: 0

      - name: Install the GitHub CLI
        # The runners are generic and do not ship `gh` (#698). Each job installs it, with no sudo, from the pinned release
        # and its checksums file, and leaves a runner that already has one alone.
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          dir="${RUNNER_TEMP}/gh-cli"
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          rm -rf "$dir"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "${dir}/${archive}" "${base}/${archive}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "${dir}/checksums.txt" "${base}/gh_${GH_VERSION}_checksums.txt"
          (cd "$dir" && awk -v f="$archive" '$2 == f' checksums.txt | sha256sum -c -)
          tar -xzf "${dir}/${archive}" -C "$dir"
          echo "${dir}/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
          "${dir}/gh_${GH_VERSION}_linux_amd64/bin/gh" --version

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Publish the new nightly
        run: |
          set -euo pipefail
          day="$(date -u +%F)"
          tag="nightly-${day}"
          echo "NIGHTLY_TAG=${tag}" >> "$GITHUB_ENV"
          releases="$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("nightly-")) | .tagName')"
          previous="${releases%%$'\n'*}"

          if [ -n "$previous" ]; then
            since="$(git rev-list -n 1 "refs/tags/${previous}" 2>/dev/null || true)"
            range="${since:+${since}..}${SHA}"
            # git limits itself: `git log | head` ends the step with 141 (SIGPIPE) under pipefail once the range is long (#1381).
            commits="$(git log -n 50 --format='- %h %s' "$range")"
            changes="Commits since \`${previous}\`:"
          else
            commits="$(git log --format='- %h %s' -n 20 "$SHA")"
            changes="Most recent commits:"
          fi

          {
            echo "Nightly snapshot of \`development\` for ${day} (UTC), built from \`${SHA}\`."
            echo
            echo "**This is unreleased and may be broken.** It passed \`npm test\` and \`npm run build\`, nothing more. Install a \`vX.Y.Z\` release if you want a supported version."
            echo
            echo "$changes"
            echo
            echo "$commits"
          } > notes.md

          git archive --format=tar.gz --prefix="podium-${tag}/" -o "podium-${tag}.tar.gz" "$SHA"
          # The reporter as an archive for Claude Desktop (#835), named for the version development carries and the day.
          # A full build, which empties dist/ in this throwaway checkout first, so the zips hold the source of the commit and nothing older.
          node scripts/plugin-build.mjs
          zip="$(node scripts/podium-reporter-zip.mjs --out . --suffix "-${tag}")"
          test -f "$zip"
          # The OpenCode reporter's archive (#857), named podium-opencode-<version>-nightly-<date>.zip.
          ozip="$(node scripts/podium-reporter-zip.mjs --harness opencode --out . --suffix "-${tag}")"
          test -f "$ozip"

          # A same-day rerun after a new commit moves the tag, so the old release of that day goes first. It is replaced, never left empty.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --cleanup-tag --yes
          fi

          gh release create "$tag" "podium-${tag}.tar.gz" "$zip" "$ozip" \
            --target "$SHA" \
            --title "Nightly ${day}" \
            --notes-file notes.md \
            --prerelease

      - name: Remove earlier nightlies
        run: |
          set -euo pipefail
          keep="$NIGHTLY_TAG" # set by the publish step, so a run that crosses midnight UTC still keeps the tag it made
          # Only after the new release exists, and only the nightly- prefix, so a vX.Y.Z release or tag is never matched.
          gh release view "$keep" >/dev/null
          gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("nightly-")) | .tagName' | while read -r old; do
            if [ "$old" != "$keep" ]; then
              gh release delete "$old" --cleanup-tag --yes
            fi
          done
