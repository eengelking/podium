name: Release asset

# Attaches podium-reporter-<version>.zip to the GitHub Release of a vX.Y.Z tag (#835). Claude Desktop installs a plugin only from an
# archive, so every release carries one. The tag is pushed first and the release is made right after (podium-release skill), so the
# job waits for the release to exist. The zip is built by scripts/podium-reporter-zip.mjs, the script a person runs too, and the job
# fails if the mod's version is not the tag's, or if the zip differs from what the `plugin-dist` branch holds for that commit
# (plugin-dist.yml publishes it on the merge to `main` and may still be running, so the job waits). Run it by hand from the Actions tab with `workflow_dispatch` to redo an upload.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to attach the zip to, e.g. v1.4.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-asset-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # The `gh` version the job installs (see "Install the GitHub CLI"). Bump it by hand when a newer release is wanted.
  GH_VERSION: '2.103.2'
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  attach:
    # No fork path applies: a tag only reaches this repo (see ci.yml).
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install the GitHub CLI
        # The runners are generic and do not ship `gh` (#698). The job installs it, with no sudo, from the pinned release
        # and its checksums file, and leaves a runner that already has one alone.
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          dir="${RUNNER_TEMP}/gh-cli"
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          rm -rf "$dir"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "${dir}/${archive}" "${base}/${archive}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "${dir}/checksums.txt" "${base}/gh_${GH_VERSION}_checksums.txt"
          (cd "$dir" && awk -v f="$archive" '$2 == f' checksums.txt | sha256sum -c -)
          tar -xzf "${dir}/${archive}" -C "$dir"
          echo "${dir}/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
          "${dir}/gh_${GH_VERSION}_linux_amd64/bin/gh" --version

      - name: Build the archive
        run: |
          set -euo pipefail
          node scripts/plugin-build.mjs claudecode
          # The zips go to dist-zips/, never dist/, which holds the build trees that plugin-dist publishes.
          node scripts/podium-reporter-zip.mjs --out dist-zips --expect-version "${TAG#v}"
          # The OpenCode archive (podium-opencode-<version>.zip, `--harness opencode`) is not built here while opencode has no
          # plugin.json; #857 adds it and attaches it.
          ls -l dist-zips

      - name: Check the zip against the plugin-dist branch
        # plugin-dist.yml publishes the same build on the merge to `main` and may still be running. The script waits, up to
        # 15 minutes, for the plugin-dist commit that names this tag's source commit, then compares the file list and the bytes.
        run: |
          set -euo pipefail
          sha="$(git rev-list -n 1 "refs/tags/${TAG}")"
          node scripts/plugin-dist-compare.mjs \
            --zip dist-zips/podium-reporter-"${TAG#v}".zip \
            --sha "$sha" --version "${TAG#v}" --wait 900 --interval 30

      - name: Attach it to the release
        run: |
          set -euo pipefail
          # The release is made by hand just after the tag is pushed; give it up to 30 minutes.
          for _ in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist-zips/podium-reporter-*.zip --clobber
              gh release view "$TAG" --json assets --jq '.assets[].name'
              exit 0
            fi
            echo "No release for $TAG yet; waiting."
            sleep 30
          done
          echo "No GitHub Release for $TAG appeared. Create it, then re-run this workflow." >&2
          exit 1
