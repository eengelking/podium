name: Mod version bump check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-version-bump:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A harness is plugin/<harness>/. The code every harness shares is plugin/core/, which ships inside each one, so a change
      # there changes every harness. Each harness with a version file (a Claude Code .claude-plugin/plugin.json, or a package.json)
      # must bump it when its own code or core changed; a harness with no version file yet is skipped, so adding one needs no edit here.
      - name: Require a version bump in each plugin that changed
        run: |
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          # Three dots: only this PR's own changes, not whatever landed on main since the branch point.
          git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | grep -Ev '\.test\.ts$' > /tmp/changed_files.txt || true
          fail=0
          for dir in plugin/*/; do
            harness=$(basename "$dir")
            [ "$harness" = core ] && continue
            grep -Eq "^plugin/($harness|core)/" /tmp/changed_files.txt || continue
            for path in "plugin/$harness/.claude-plugin/plugin.json" "plugin/$harness/package.json"; do
              git cat-file -e "${{ github.event.pull_request.head.sha }}:$path" 2>/dev/null || continue
              base_version=$(git show "$base:$path" 2>/dev/null | jq -r '.version' || true)
              head_version=$(git show "${{ github.event.pull_request.head.sha }}:$path" | jq -r '.version')
              echo "$path: base $base_version, head $head_version"
              if [ "$base_version" = "$head_version" ]; then
                echo "::error::This PR changes plugin/$harness (or plugin/core) but $path's version ($base_version) was not bumped. Installed copies only update when it changes. See CONTRIBUTING.md."
                fail=1
              fi
            done
          done
          exit $fail
