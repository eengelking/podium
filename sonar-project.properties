sonar.host.url=https://sonarcloud.io
sonar.organization=eengelking
sonar.projectKey=eengelking_podium

# The static HTML design mockups are not shipped code. Neither are the docs, which include the standards pages: about 1.8 MB of
# HTML generated from the app by `npm run standards:sync`, so what a rule would flag in them is fixed in the app or the generator.
#
# frontend/src/main.tsx is the app's entry point. SonarJasmin's React render simulation starts at the root and walks every component
# under it, and from this file it runs into its 300 s limit on each full analysis, which made the Sonar job take 6 to 8 minutes while
# every other file finished in seconds (#501). It is a 30-line bootstrap with no logic or tests; each component is still analyzed
# on its own.
sonar.exclusions=mockup/**,docs/**,frontend/src/main.tsx

# Test code. Sonar tells tests from product code by name, so the test files are declared here, in the same tree as the sources
# (`sonar.test.inclusions` picks the tests out of it). server/src/tlsTesting.ts is declared with them although it is not named
# *.test.ts: it builds throwaway CAs and certificates by running `openssl` and only the tests import it, so the product-code rule
# about the PATH (typescript:S4036) does not apply to it (#668). Nothing else is moved: product code is still analyzed in full.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,server/src/tlsTesting.ts

# Coverage comes from `npm run test:coverage`; the Sonar workflow runs it before the scan and
# prefixes each path with its workspace. The New Code coverage gate reads these.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,frontend/coverage/lcov.info
# The mod's hooks are left out of coverage: their tests import claude-code/testing, so they run only through `npm run test:mod` (it needs
# Claude Code installed, which CI does not have) and can never feed an lcov report. Counting them made every line a mod change adds read as
# uncovered (#400). scripts/page-shot.mjs drives a real Chrome over the DevTools protocol, which the runners do not have; its argument
# parsing, Chrome lookup and cleanup are tested in scripts/page-shot.test.ts, and the rest was run by hand (#475).
# scripts/podium-recording-load.mjs and scripts/podium-recording-seed.mjs are developer tools for session recording (#353): the first
# measures write load against a built server and reads macOS counters (ioreg, proc_pid_rusage), the second seeds a throwaway server
# over its HTTP API. Neither can run on a CI runner, and no logic the product relies on lives in them.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/testSetup.ts,**/setupTests.ts,mod/podium-reporter/hooks/**,scripts/page-shot.mjs,scripts/podium-recording-load.mjs,scripts/podium-recording-seed.mjs

# samples.ts is a table of component entries (id, title, cases with a screen and a selector), so its entries share one shape by
# design and SonarCloud reads that as 83% duplicated. It is data, not logic to factor out: left out of duplication only (#396).
# The mod's protocol.ts holds a verbatim copy of the server's protocol block, by design: `protocol.test.ts` fails if the two differ,
# so the copy is checked, not drifting. Every protocol change adds the same lines to both, which read as new duplication (#412).
sonar.cpd.exclusions=frontend/src/fleet/standards/samples.ts,mod/podium-reporter/hooks/protocol.ts
