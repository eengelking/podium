sonar.host.url=https://sonarcloud.io
sonar.organization=eengelking
sonar.projectKey=eengelking_podium

# The static HTML design mockups are not shipped code. Neither are the docs, which include the standards pages: about 1.8 MB of
# HTML generated from the app by `npm run standards:sync`, so what a rule would flag in them is fixed in the app or the generator.
#
# frontend/src/main.tsx is the app's entry point. SonarJasmin's React render simulation starts at the root and walks every component
# under it, and from this file it runs into its 300 s limit on each full analysis, which made the Sonar job take 6 to 8 minutes while
# every other file finished in seconds (#501). It is a 30-line bootstrap with no logic or tests; each component is still analyzed
# on its own.
sonar.exclusions=mockup/**,docs/**,frontend/src/main.tsx,site/og/**

# Test code. Sonar tells tests from product code by name, so the test files are declared here, in the same tree as the sources
# (`sonar.test.inclusions` picks the tests out of it). server/src/tlsTesting.ts is declared with them although it is not named
# *.test.ts: it builds throwaway CAs and certificates by running `openssl` and only the tests import it, so the product-code rule
# about the PATH (typescript:S4036) does not apply to it (#668). Nothing else is moved: product code is still analyzed in full.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,server/src/tlsTesting.ts,e2e/**/*.cy.js

# Coverage comes from `npm run test:coverage`; the Sonar workflow runs it before the scan and
# prefixes each path with its workspace. The New Code coverage gate reads these.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,frontend/coverage/lcov.info
# The mod's hooks are left out of coverage: their tests import claude-code/testing, so they run only through `npm run test:mod` (it needs
# Claude Code installed, which CI does not have) and can never feed an lcov report. Counting them made every line a mod change adds read as
# uncovered (#400). scripts/page-shot.mjs drives a real Chrome over the DevTools protocol, which the runners do not have; its argument
# parsing, Chrome lookup and cleanup are tested in scripts/page-shot.test.ts, and the rest was run by hand (#475).
# scripts/podium-recording-load.mjs and scripts/podium-recording-seed.mjs are developer tools for session recording (#353): the first
# measures write load against a built server and reads macOS counters (ioreg, proc_pid_rusage), the second seeds a throwaway server
# over its HTTP API. Neither can run on a CI runner, and no logic the product relies on lives in them.
# scripts/podium-perf.mjs, scripts/podium-perf-browser.sh and scripts/podium-perf-mod.mjs are the performance audit's tools (#682): they
# start a built server and the simulator, or a headless Chrome, and read macOS process counters, so the runners cannot exercise them, and no
# logic the product relies on lives in them. Each prints its usage with --help and was run against a throwaway server by hand.
# scripts/check-doc-links.mjs and scripts/check-doc-frontmatter.mjs run their check as soon as they are loaded, so a test can only run them as a
# process, which the coverage report cannot follow; their tests (check-doc-links.test.ts, check-doc-frontmatter.test.ts) run them end to end,
# and the file walk they share is in scripts/docTopics.mjs, which is covered. The two new checks (#697) export a run() and are covered in-process.
# scripts/podium-golden.mjs (#313) is a developer tool: it signs in to a throwaway server over HTTP and reads its SQLite file, to diff the
# read behavior of two builds. It needs a running server, so the runners cannot exercise it, and no logic the product relies on lives in it.
# It prints its usage with --help and was run by hand against the old and the new build.
# The docs site (#688): site/scripts/lib.mjs holds the logic and is tested in scripts/site-lib.test.ts. site/scripts/build.mjs runs git and a
# full Astro build per version, site/astro.config.mjs reads the environment that build sets, and site/src/ is Astro components and CSS; CI
# exercises all three by building the site (docs-site.yml), which is the test that matters for them.
# The end-to-end suite (#782, DECISIONS 49): e2e/ is the Cypress specs and support code, which run in a container against a built server, and
# scripts/e2e-seed.mjs and scripts/e2e-up.sh are its seed and runner. None can run under vitest, and no logic the product relies on lives in them;
# the check that its coverage map names real files is scripts/e2e-map.mjs, which is covered (scripts/e2e-map.test.ts).
# scripts/podium-perf-storage.mjs (#822) is a developer tool like podium-perf.mjs: it starts a built server and a delay proxy, and prints its usage with --help.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/testSetup.ts,**/setupTests.ts,mod/podium-reporter/hooks/**,e2e/**,scripts/e2e-seed.mjs,scripts/e2e-map.mjs,scripts/page-shot.mjs,scripts/podium-golden.mjs,scripts/podium-recording-load.mjs,scripts/podium-recording-seed.mjs,scripts/podium-perf.mjs,scripts/podium-perf-storage.mjs,scripts/podium-perf-browser.sh,scripts/podium-perf-mod.mjs,site/scripts/build.mjs,site/astro.config.mjs,site/src/**,scripts/check-doc-links.mjs,scripts/check-doc-frontmatter.mjs

# samples.ts is a table of component entries (id, title, cases with a screen and a selector), so its entries share one shape by
# design and SonarCloud reads that as 83% duplicated. It is data, not logic to factor out: left out of duplication only (#396).
# The mod's protocol.ts holds a verbatim copy of the server's protocol block, by design: `protocol.test.ts` fails if the two differ,
# so the copy is checked, not drifting. Every protocol change adds the same lines to both, which read as new duplication (#412).
# The e2e specs (#782) repeat the same open-a-page-and-assert shape by design, one test per rule of the spec: left out of duplication too.
# The PostgreSQL adapter (#822) mirrors the SQLite one by design: the same validation, the same row mapping, the SQL differing only where
# PostgreSQL needs it. server/src/storage/contract.ts is what checks that the two agree, and the SQLite files keep being measured.
# scripts/podium-perf-storage.mjs repeats helper code of scripts/podium-perf.mjs on purpose: two standalone developer tools.
sonar.cpd.exclusions=frontend/src/fleet/standards/samples.ts,mod/podium-reporter/hooks/protocol.ts,e2e/**,server/src/storage/postgres/**,scripts/podium-perf-storage.mjs

# The end-to-end runner (#782) talks to Podium over plain http on a private, throwaway container network that exists for one run and has no other
# member, and to 127.0.0.1 inside the server container for its health check. Nothing leaves the machine, and there is no certificate to check on
# a network that is deleted afterwards, so the clear-text-protocol rule (shell:S5332) is ignored for that one script and nothing else.
sonar.issue.ignore.multicriteria=e2e1
sonar.issue.ignore.multicriteria.e2e1.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e2e1.resourceKey=scripts/e2e-up.sh
