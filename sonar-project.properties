sonar.host.url=https://sonarcloud.io
sonar.organization=eengelking
sonar.projectKey=eengelking_podium

# The static HTML design mockups are not shipped code. Neither are the docs, which include the standards pages: about 1.8 MB of
# HTML generated from the app by `npm run standards:sync`, so what a rule would flag in them is fixed in the app or the generator.
sonar.exclusions=mockup/**,docs/**

# Coverage comes from `npm run test:coverage`; the Sonar workflow runs it before the scan and
# prefixes each path with its workspace. The New Code coverage gate reads these.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,frontend/coverage/lcov.info
# The mod's hooks are left out of coverage: their tests import claude-code/testing, so they run only through `npm run test:mod` (it needs
# Claude Code installed, which CI does not have) and can never feed an lcov report. Counting them made every line a mod change adds read as
# uncovered (#400).
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/testSetup.ts,**/setupTests.ts,mod/podium-reporter/hooks/**

# samples.ts is a table of component entries (id, title, cases with a screen and a selector), so its entries share one shape by
# design and SonarCloud reads that as 83% duplicated. It is data, not logic to factor out: left out of duplication only (#396).
# The mod's protocol.ts holds a verbatim copy of the server's protocol block, by design: `protocol.test.ts` fails if the two differ,
# so the copy is checked, not drifting. Every protocol change adds the same lines to both, which read as new duplication (#412).
sonar.cpd.exclusions=frontend/src/fleet/standards/samples.ts,mod/podium-reporter/hooks/protocol.ts
