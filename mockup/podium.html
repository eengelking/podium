<title>Podium Fleet Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frontend/src/fleet/tokens.css">
<style>/* Layout: three-pane ops console. Left rail lists every live orchestrator; centre is the fleet wall or one orchestrator's plan + agent tree; right is the activity stream or the selected agent's detail. */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sonnet); outline-offset: 1px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
svg { display: block; }
svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* shell */
.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; padding-inline: 0; }
.top { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.logo svg { width: 20px; height: 20px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; color: var(--ink2); white-space: nowrap; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--raised); font-size: 12px; font-weight: 500; }
.btn:hover { background: var(--sel); }
.btn[aria-pressed="true"] { background: var(--sel); border-color: var(--axis); }
.banner { padding: 5px 16px; font-size: 12px; color: var(--ink2); background: var(--raised); border-bottom: 1px solid var(--border); }
.banner b { color: var(--ink); font-weight: 600; }
.cols { --rail-w: 252px; --side-w: 340px; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--side-w); min-height: 0; position: relative; }
.rz { position: absolute; top: 0; bottom: 0; width: 9px; margin-left: -4px; z-index: 5; cursor: col-resize; touch-action: none; }
.rz::after { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: transparent; transition: background .15s; }
.rz:hover::after, .rz:focus-visible::after, .rz.drag::after { background: var(--sonnet); }
.rz.rail { left: var(--rail-w); } .rz.side { left: auto; right: var(--side-w); margin-left: 0; margin-right: -4px; }
body.resizing { cursor: col-resize; user-select: none; } body.resizing * { cursor: col-resize !important; }
.rail, .main, .side { min-height: 0; overflow: auto; }
.rail { border-right: 1px solid var(--border); background: var(--surface); }
.side { border-left: 1px solid var(--border); background: var(--surface); }
.main { padding: 14px 16px 24px; }

/* live dot + status */
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.running { background: var(--good); animation: pulse 1.8s ease-out infinite; }
.dot.waiting { background: transparent; border: 2px solid var(--warn); }
.dot.stale { background: var(--serious); }
.dot.done { background: var(--axis); }
.dot.failed { background: var(--crit); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(12,163,12,.55); } 70% { box-shadow: 0 0 0 6px rgba(12,163,12,0); } 100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); } }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.st.running { color: var(--good-text); } .st.done { color: var(--muted); } .st.failed { color: var(--crit-text); }
.st.queued, .st.waiting { color: var(--warn); } .st.stale { color: var(--serious); }

/* rail */
.rail h2, .side h2, .sec h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
.rail-head { padding: 12px 14px 6px; display: flex; justify-content: space-between; align-items: baseline; }
.ritem { display: block; width: 100%; padding: 9px 14px; border-left: 3px solid transparent; border-bottom: 1px solid var(--grid); }
.ritem:hover { background: var(--hover); }
.ritem[aria-current="true"] { background: var(--sel); border-left-color: var(--ink); }
.ritem .l1 { display: flex; align-items: center; gap: 8px; }
.ritem .nm { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ritem .l2 { display: flex; align-items: center; gap: 8px; margin-top: 5px; color: var(--ink2); font-size: 12px; }
.ritem .bar { flex: 1; }
.ritem.enter, .card.enter { animation: enter .9s ease-out; }
.ritem.leave, .card.leave { animation: leave .6s ease-in forwards; }
@keyframes enter { 0% { background: color-mix(in srgb, var(--good) 28%, transparent); transform: translateY(-4px); opacity: 0; } 30% { opacity: 1; transform: none; } 100% { } }
@keyframes leave { to { opacity: 0; transform: translateX(-8px); } }

/* chips + meters */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 4px; font-size: 11.5px; font-weight: 500; border: 1px solid var(--border); white-space: nowrap; color: var(--ink2); }
.chip i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.chip.skill { font-family: var(--font-mono); font-size: 11px; }
.eff { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink2); white-space: nowrap; }
.eff .m { display: inline-flex; gap: 2px; }
.eff .m b { width: 4px; height: 10px; border-radius: 1px; background: var(--axis); }
.eff .m b.on { background: var(--ink2); }
.bar { height: 5px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--ink2); transition: width .8s linear; }
.bar.ctx > i { background: var(--sonnet); }
.bar.hot > i { background: var(--warn); }
.bar.plan > i { background: var(--good); }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
.kpi { background: var(--surface); padding: 10px 12px; min-width: 0; }
.kpi .k { color: var(--muted); font-size: 12px; }
.kpi .v { font-size: 22px; font-weight: 600; margin-top: 2px; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 6px; }
.kpi .v small { font-size: 12px; color: var(--ink2); font-weight: 500; letter-spacing: 0; }
.kpi svg.sp { width: 100%; height: 26px; margin-top: 4px; }
.sp polyline { fill: none; stroke: var(--ink2); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.sp .area { fill: var(--grid); stroke: none; }

/* toolbar */
.tools { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { padding: 4px 10px; font-size: 12px; font-weight: 500; color: var(--ink2); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--ink); }
.search { background: var(--raised); border: 1px solid var(--border); color: var(--ink); border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12px; width: 190px; }

/* cards */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; justify-content: flex-start; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 0; }
.card:hover { border-color: var(--axis); background: var(--raised); }
.card .h { display: flex; align-items: center; gap: 8px; }
.card .nm { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .path { color: var(--muted); font-size: 11.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta { display: flex; gap: 8px; align-items: center; margin-top: 9px; flex-wrap: wrap; }
.card .plan { margin-top: 10px; }
.card .plan .t { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin-bottom: 4px; }
.card .plan .t span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
.crew { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 10px; align-items: center; min-height: 14px; }
.crew .a { width: 11px; height: 11px; border-radius: 2px; background: var(--c); opacity: 1; }
.crew .a.done { opacity: .28; }
.crew .a.failed { outline: 2px solid var(--crit); outline-offset: -1px; }
.crew .a.queued { background: transparent; border: 1.5px dashed var(--c); }
.crew .a.fork { border-radius: 50%; }
.crew .a.running { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .55; } }
.card .foot { display: flex; justify-content: space-between; align-items: end; margin-top: 10px; color: var(--ink2); font-size: 12px; gap: 8px; }
.card .foot svg.sp { width: 92px; height: 22px; }
.card .noplan { margin-top: 10px; color: var(--muted); font-size: 12px; }
.card .alert { margin-top: 10px; padding: 5px 8px; border-radius: 5px; font-size: 12px; background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.card .alert.stale { background: color-mix(in srgb, var(--serious) 14%, transparent); border-color: color-mix(in srgb, var(--serious) 45%, transparent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink2); font-size: 12px; margin: 14px 0 0; align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend .a { width: 10px; height: 10px; border-radius: 2px; background: var(--ink2); }
.legend .a.f { border-radius: 50%; }
.legend .a.q { background: transparent; border: 1.5px dashed var(--ink2); }
.legend .a.d { opacity: .3; }

/* focus view */
.fh { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-start; margin-bottom: 14px; }
.fh h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; display: flex; gap: 10px; align-items: center; }
.fh .sub { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
.facts { display: flex; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 14px; flex-wrap: wrap; }
.fact { background: var(--surface); padding: 8px 12px; flex: 1 1 110px; min-width: 0; }
.fact .k { color: var(--muted); font-size: 11.5px; } .fact .v { font-size: 14px; font-weight: 600; margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
.sec { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; min-width: 0; }
.sec > .sh { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--border); gap: 8px; }
.sec > .sh .src { font-size: 11.5px; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 4px 0; }
.step { display: flex; gap: 9px; padding: 6px 12px; align-items: flex-start; }
.step .ic { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--axis); flex: none; margin-top: 1px; display: grid; place-items: center; }
.step.done .ic { background: var(--good); border-color: var(--good); color: #fff; }
.step.done .tx { color: var(--muted); }
.step.active .ic { border-color: var(--good); } .step.active .ic::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--good); animation: blink 1.4s ease-in-out infinite; }
.step.wait .ic { border-color: var(--warn); }
.step .tx { flex: 1; min-width: 0; }
.step .ow { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.step.active .tx { font-weight: 600; }
.empty { padding: 18px 14px; color: var(--muted); font-size: 12.5px; }

/* agent tree */
.tw { overflow-x: auto; }
.trow { display: grid; grid-template-columns: minmax(210px, 1fr) 92px 78px 138px 56px 56px 50px 86px; gap: 10px; align-items: center; padding: 0 12px; min-height: 36px; border-bottom: 1px solid var(--grid); width: 100%; min-width: 820px; }
.trow.hd { min-height: 28px; color: var(--muted); font-size: 11.5px; position: sticky; top: 0; background: var(--surface); }
button.trow:hover { background: var(--hover); }
button.trow[aria-current="true"] { background: var(--sel); }
.trow .nm { display: flex; align-items: center; gap: 7px; min-width: 0; }
.trow .nm .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .nm .tx b { font-weight: 600; } .trow .nm .tx em { color: var(--muted); font-style: normal; margin-left: 6px; }
.trow .nm svg { color: var(--muted); }
.trow .nm .kfork { color: var(--ink); }
.indent { display: inline-flex; flex: none; }
.indent s { width: 16px; height: 36px; display: block; position: relative; text-decoration: none; }
.indent s::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; border-left: 1px solid var(--axis); }
.indent s.last::before { bottom: 50%; }
.indent s.last::after { content: ""; position: absolute; left: 7px; top: 50%; width: 9px; border-top: 1px solid var(--axis); }
.indent s.blank::before { display: none; }
.trow.root { background: var(--raised); }
.num { text-align: right; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink2); }
.ctxc { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink2); }
.ctxc .bar { flex: 1; }

/* side */
.side .sh { padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: center; }
.ev { list-style: none; margin: 0; padding: 0; }
.ev li { display: grid; grid-template-columns: 58px 8px 1fr; gap: 8px; padding: 6px 14px; border-bottom: 1px solid var(--grid); align-items: baseline; }
.ev li.new { animation: enter 1.2s ease-out; }
.ev time { color: var(--muted); font-size: 11.5px; }
.ev .ed { width: 7px; height: 7px; border-radius: 2px; background: var(--c); align-self: center; }
.ev .tt { min-width: 0; overflow-wrap: anywhere; }
.ev .tt b { font-weight: 600; }
.ev .tt .sm { color: var(--muted); }
.ev li.bad .tt { color: var(--crit-text); }
.det { padding: 0 14px 20px; }
.det h3 { margin: 0 0 2px; font-size: 15px; letter-spacing: -0.01em; }
.det .grid2 { display: grid; grid-template-columns: 92px 1fr; gap: 7px 10px; margin: 12px 0; align-items: center; }
.det .grid2 dt { color: var(--muted); font-size: 12px; } .det .grid2 dd { margin: 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.det .pr { background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; font-size: 12.5px; color: var(--ink2); }
.det .lab { font-size: 12px; color: var(--muted); margin: 14px 0 5px; display: block; }
.det .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
.back { display: inline-flex; gap: 6px; align-items: center; color: var(--ink2); font-size: 12px; padding: 12px 14px 4px; }
.back:hover { color: var(--ink); }
.trail { list-style: none; padding: 0; margin: 0; font-size: 12px; }
.trail li { padding: 4px 0; border-bottom: 1px solid var(--grid); display: flex; gap: 8px; color: var(--ink2); } .trail li span:first-child { color: var(--muted); width: 48px; flex: none; }
.foot-note { padding: 10px 14px; color: var(--muted); font-size: 11.5px; border-top: 1px solid var(--grid); }
.kpi-cap { color: var(--muted); font-size: 11.5px; }
.none { padding: 40px 16px; text-align: center; color: var(--muted); }

/* git line */
.git { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; margin-top: 4px; color: var(--ink2); font-size: 11.5px; font-family: var(--font-mono); }
.git > span { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
.git .br { color: var(--ink); }
.git .wt { padding: 0 6px; border: 1px solid var(--border); border-radius: 4px; font-family: var(--font-ui); font-size: 11px; }
.git .wt.no { color: var(--muted); border-style: dashed; }
.git .dirty { color: var(--warn); }
.card .git { margin-top: 5px; }

/* context blowouts */
.blow { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 4px; font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); color: var(--ink); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.blow.l2 { border-color: var(--crit); background: color-mix(in srgb, var(--crit) 20%, transparent); color: var(--crit-text); }
.blow svg { width: 12px; height: 12px; }
.bar.bx > i { background: var(--warn); }
.bar.bx2 > i { background: repeating-linear-gradient(135deg, var(--crit) 0 4px, color-mix(in srgb, var(--crit) 55%, var(--surface)) 4px 8px); }
.card.risk { border-color: var(--crit); box-shadow: inset 0 3px 0 var(--crit); }
.ritem.risk { border-left-color: var(--crit); }
.callout { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); font-size: 12.5px; }
.callout.l2 { border-color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, transparent); }
.callout svg { width: 18px; height: 18px; margin-top: 1px; color: var(--warn); }
.callout.l2 svg { color: var(--crit-text); }
.callout b { font-weight: 600; } .callout ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.callout .lk { text-decoration: underline; text-underline-offset: 2px; }
.tl { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.tl li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--grid); color: var(--ink2); }
.tl time { color: var(--muted); }

/* failures */
.failbox { border: 1px solid color-mix(in srgb, var(--crit) 60%, transparent); border-radius: 8px; overflow: hidden; margin: 12px 0; }
.failbox .fh2 { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: color-mix(in srgb, var(--crit) 16%, transparent); font-weight: 600; color: var(--crit-text); }
.failbox .fb { padding: 10px; display: grid; gap: 9px; font-size: 12.5px; }
.code { margin: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font: 11.5px/1.5 var(--font-mono); color: var(--ink2); overflow-x: auto; white-space: pre; }
.code .bad { color: var(--crit-text); }
.failbox .cause { padding: 8px 10px; border-left: 3px solid var(--warn); background: var(--raised); border-radius: 0 6px 6px 0; }
.failbox .lab { margin: 0 0 3px; }
.rowerr { color: var(--crit-text); font-style: normal; margin-left: 6px; }

/* activity */
.ev li { padding: 0; display: block; }
.ev .evb { display: grid; grid-template-columns: 58px 8px 1fr; gap: 8px; padding: 6px 14px; align-items: baseline; width: 100%; }
button.evb:hover { background: var(--hover); }
.ev li.cur .evb { background: var(--sel); }
.ev .go { color: var(--muted); font-size: 11px; display: block; margin-top: 1px; }
.ev li.gone .evb { cursor: default; opacity: .65; }
.ev li.blowev .tt { color: var(--ink); } .ev li.blowev .evb { box-shadow: inset 3px 0 0 var(--warn); }
.ev li.bad .evb { box-shadow: inset 3px 0 0 var(--crit); }
.more { display: flex; gap: 8px; padding: 10px 14px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
.more .btn { padding: 3px 9px; }
.flash > * { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--warn) 35%, transparent); } 100% { background: transparent; } }

/* orchestrator charts */
.hcs { display: flex; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.hc { background: var(--surface); padding: 8px 10px 6px; width: 172px; min-width: 0; }
.hc .ht { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 11.5px; color: var(--muted); }
.hc .ht .hl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hc .ht .hv { color: var(--ink); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.hc svg { width: 100%; height: 46px; margin-top: 4px; cursor: crosshair; }
.hc polyline { fill: none; stroke: var(--ink2); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.hc polyline.area { fill: var(--grid); stroke: none; }
.hc .gl { stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
.hc .lim { stroke: var(--crit); stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; vector-effect: non-scaling-stroke; }
.hc .mk { stroke: var(--crit); stroke-width: 2; vector-effect: non-scaling-stroke; }
.hc .xh { stroke: var(--ink); stroke-width: 1; opacity: .55; vector-effect: non-scaling-stroke; }
.hc .hx { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.hc .hx .cr { color: var(--crit-text); }

    fleetCost.push(fTok / 1e6 * 14); fleetCost.shift();
    orchs.forEach(function (o) { if (o.leaving) return; o.peakH.push(peakOf(o)); o.peakH.shift(); o.runH.push(counts(o).run); o.runH.shift(); });
    if (tickN % 26 === 0 && orchs.length < 8) startSession();
    if (changed || events.some(function (e) { return e.isNew; })) { renderRail(); renderMain(); renderSide(); }
    upd();
  }
  for (var i = 0; i < 60; i++) { fleetTok.push(rnd(20e3, 60e3)); fleetCost.push(rnd(0.3, 0.9)); }
  setInterval(tick, 1000);

  /* ---------- interaction ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-sel],[data-agent],[data-f],[data-ev],[data-more],[data-asort],#bBack,#bCopy'); if (!t) return;
    if (t.dataset.ev) {
      var evn = events.filter(function (x) { return String(x.id) === t.dataset.ev; })[0], eo = evn && byId(evn.o); if (!eo) return;
      sel = eo.id; selAgent = evn.a && findAgent(evn.a) ? evn.a : null; flashAgent = selAgent; renderAll();
      var row = selAgent && document.getElementById('row-' + selAgent); if (row && row.scrollIntoView) row.scrollIntoView({ block: 'center' });
      var sd = $('#side'); if (sd) sd.scrollTop = 0;
    }
    else if (t.dataset.more) { evShow = t.dataset.more === 'more' ? evShow + 12 : 12; renderSide(); }
    else if (t.dataset.asort !== undefined) {
      var k = t.dataset.asort; if (!k) aSort = { key: null, dir: 1 }; else if (aSort.key === k) aSort.dir = -aSort.dir; else aSort = { key: k, dir: k === 'model' || k === 'effort' || k === 'status' ? 1 : -1 };
      renderMain(); upd();
    }
    else if (t.dataset.sel) { sel = t.dataset.sel === 'all' ? null : t.dataset.sel; selAgent = null; renderAll(); }
    else if (t.dataset.agent) { selAgent = t.dataset.agent; renderMain(); renderSide(); upd(); }
    else if (t.dataset.f) { filter.status = t.dataset.f; renderMain(); upd(); }
    else if (t.id === 'bBack') { selAgent = null; renderSide(); }
    else if (t.id === 'bCopy') { var o = byId(sel); var txt = 'claude --resume ' + o.session; if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(function () {}); t.textContent = 'Copied ' + txt; setTimeout(function () { t.textContent = 'Copy resume command'; }, 1600); }
  });
  /* resizable side panels: drag, arrow keys, double-click to reset; width is remembered */
  (function () {
    var cols = $('.cols'), LIM = { rail: [180, 440], side: [260, 700] }, MIN_MAIN = 420, KEY = 'podium.panels';
    var store = { get: function () { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }, set: function (v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} } };
    var cur = function (k) { return parseFloat(getComputedStyle(cols).getPropertyValue('--' + k + '-w')) || LIM[k][0]; };
    function apply(k, w, save) {
      var other = cur(k === 'rail' ? 'side' : 'rail'), max = Math.min(LIM[k][1], cols.clientWidth - other - MIN_MAIN);
      w = Math.round(Math.max(LIM[k][0], Math.min(max, w)));
      cols.style.setProperty('--' + k + '-w', w + 'px'); $('#rz' + (k === 'rail' ? 'Rail' : 'Side')).setAttribute('aria-valuenow', w);
      if (save) { var st = store.get(); st[k] = w; store.set(st); }
    }
    function reset(k) { cols.style.removeProperty('--' + k + '-w'); var st = store.get(); delete st[k]; store.set(st); }
    ['rail', 'side'].forEach(function (k) {
      var h = $('#rz' + (k === 'rail' ? 'Rail' : 'Side'));
      h.addEventListener('pointerdown', function (e) {
        if (e.button) return; e.preventDefault(); h.setPointerCapture(e.pointerId); h.classList.add('drag'); document.body.classList.add('resizing');
        var move = function (ev) { var r = cols.getBoundingClientRect(); apply(k, k === 'rail' ? ev.clientX - r.left : r.right - ev.clientX, false); };
        var up = function (ev) { h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); h.classList.remove('drag'); document.body.classList.remove('resizing'); apply(k, cur(k), true); };
        h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
      });
      h.addEventListener('dblclick', function () { reset(k); });
      h.addEventListener('keydown', function (e) {
        var step = e.shiftKey ? 48 : 16, dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!dir) { if (e.key === 'Home' || e.key === 'Escape') reset(k); return; }
        e.preventDefault(); apply(k, cur(k) + (k === 'rail' ? dir : -dir) * step, true);
      });
      var saved = store.get()[k]; if (saved) apply(k, saved, false);
    });
    window.addEventListener('resize', function () { var st = store.get(); ['rail', 'side'].forEach(function (k) { if (st[k]) apply(k, st[k], false); }); });
  })();

  /* chart hover: crosshair + value at the pointer */
  var SERIES = { tok: function (o) { return o.spark; }, peak: function (o) { return o.peakH; }, run: function (o) { return o.runH; } };
  var SERFMT = { tok: function (v) { return fmtTok(v) + '/s'; }, peak: function (v) { return Math.round(v * 100) + '%'; }, run: function (v) { return String(v); } };
  document.addEventListener('mousemove', function (e) {
    var svg = e.target.closest && e.target.closest('.hc svg'); if (!svg) return;
    var hc = svg.parentNode, o = byId(hc.dataset.o), r = svg.getBoundingClientRect(); if (!o || !r.width) return;
    var arr = SERIES[hc.dataset.k](o), idx = Math.max(0, Math.min(59, Math.round((e.clientX - r.left) / r.width * 59)));
    var x = idx / 59 * 120, xh = $('.xh', svg); xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.hidden = false;
    hc.dataset.hover = '1'; $('.hv', hc).textContent = fmtClock(T - (59 - idx)).slice(3) + '  ' + SERFMT[hc.dataset.k](arr[idx]);
  });
  document.addEventListener('mouseout', function (e) {
    var svg = e.target.closest && e.target.closest('.hc svg'); if (!svg || svg.contains(e.relatedTarget)) return;
    var hc = svg.parentNode; delete hc.dataset.hover; $('.xh', svg).hidden = true; upd();
  });
  $('#bPause').addEventListener('click', function () { live = !live; this.setAttribute('aria-pressed', String(!live)); this.textContent = live ? 'Pause' : 'Resume'; upd(); });
  $('#bStart').addEventListener('click', startSession);
  $('#bClear').addEventListener('click', function () {
    var c = orchs.filter(function (o) { return !o.leaving; }); if (!c.length) return;
    var o = c.filter(function (x) { return x.id === sel; })[0] || pick(c);
    ev(o, null, 'end', 'session.end · /clear'); removeOrch(o, 'cleared');
  });
  $('#bTheme').addEventListener('click', function () {
    var r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
  });

  renderAll();
})();
</script>
