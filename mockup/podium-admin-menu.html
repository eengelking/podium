<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Menu Sections</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Schibsted+Grotesk:wght@400;500;600;650&display=swap">
<link rel="stylesheet" href="../frontend/src/fleet/tokens.css">
<style>/* Layout: a review sheet. Three options, each shown wide and narrow, light and dark, built from Podium's own tokens. */
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); line-height: 1.5; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 1040px; margin: 0 auto; display: grid; gap: 40px; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 650; margin: 0 0 4px; }
p { margin: 0; color: var(--ink2); max-width: 68ch; font-size: 14px; }
.opt { display: grid; gap: 16px; padding-top: 28px; border-top: 1px solid var(--border); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.cap { font-size: 12px; color: var(--ink2); margin-bottom: 6px; }
.stage { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.strips { display: grid; gap: 16px; }

/* ---- Podium tokens, scoped per frame ---- */
.t-light { --bg: #f9f9f7; --surface: #fcfcfb; --raised: #f1f0ec; --ink: #0b0b0b; --ink2: #52514e; --muted: #6b6a64; --border: rgba(11,11,11,.10); --hover: rgba(11,11,11,.04); --sel: rgba(11,11,11,.07); }
.t-dark  { --bg: #0d0d0d; --surface: #1a1a19; --raised: #232321; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --border: rgba(255,255,255,.10); --hover: rgba(255,255,255,.045); --sel: rgba(255,255,255,.08); }
.fr { background: var(--bg); color: var(--ink); font: 13px var(--font-ui); }
.fr button { font: inherit; background: none; border: 0; color: inherit; cursor: default; text-align: left; }

/* ---- Today's CSS (admin.css), unchanged, as the base ---- */
.fr .nav { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; }
.fr .navin { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 16px 12px; }
.fr .ngroup { display: grid; gap: 2px; }
.fr .gh { padding: 0 8px 4px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.fr .gh svg { display: none; flex: none; }
.fr .navbtn { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border-left: 2px solid transparent; border-radius: 6px; color: var(--ink2); }
.fr .navbtn[aria-current="page"] { background: var(--sel); color: var(--ink); font-weight: 600; border-left-color: var(--ink); border-radius: 0 6px 6px 0; }
.fr .n { font: 11px var(--font-mono); color: var(--muted); font-weight: 400; }
.fr .lock { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; width: fit-content; }
.fr .hint { font-size: 11.5px; color: var(--muted); }
.fr .navfoot { margin-top: auto; display: grid; gap: 8px; padding-top: 16px; }
.wide .nav { width: 100%; min-height: 380px; border-right: 0; }
.fr .gtitle { display: contents; }

/* narrow layout (<= 760px): strip along the top, headings hidden */
.narrow .nav { border-right: 0; border-bottom: 1px solid var(--border); flex-direction: row; overflow-x: auto; }
.narrow .navin { flex-direction: row; gap: 8px; padding: 8px 12px; align-items: center; width: max-content; }
.narrow .ngroup { display: flex; gap: 2px; align-items: center; }
.narrow .gh, .narrow .hint { display: none; }
.narrow .navbtn { width: auto; white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; }
.narrow .navbtn[aria-current="page"] { border-left-color: transparent; border-bottom-color: var(--ink); border-radius: 6px 6px 0 0; }
.narrow .navfoot { margin: 0 0 0 auto; padding: 0 0 0 12px; display: flex; }

/* ---- Option A: a rule between groups, heading in primary ink and a step larger ---- */
.oA .navin { gap: 0; }
.oA .ngroup + .ngroup { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.oA .gh { font-size: 13px; font-weight: 650; color: var(--ink); padding-bottom: 6px; letter-spacing: -.005em; }
.narrow.oA .ngroup + .ngroup { margin: 0; padding: 0 0 0 8px; border-top: 0; border-left: 1px solid var(--border); height: 24px; }

/* ---- Option B: each group is a tinted block ---- */
.oB .navin { gap: 10px; padding: 12px; }
.oB .ngroup { background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 8px 6px 6px; }
.oB .gh { font-size: 12.5px; font-weight: 650; color: var(--ink2); padding: 0 8px 6px; }
.oB .navbtn:hover { background: var(--hover); }
.narrow.oB .navin { gap: 8px; padding: 8px 12px; }
.narrow.oB .ngroup { padding: 3px; border-radius: 8px; }

/* ---- Option C: heading with a small outline icon and a rule under it ---- */
.oC .navin { gap: 20px; }
.oC .gh { font-size: var(--hs, 14px); font-weight: 650; color: var(--ink); padding: 0 8px 6px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
.s14 { --hs: 14px; --is: 15px; } .s16 { --hs: 16px; --is: 17px; } .s18 { --hs: 18px; --is: 19px; }
.oC .gh { gap: 8px; }
.oC .gh svg { width: var(--is); height: var(--is); display: block; color: var(--ink2); }
.narrow.oC .ngroup { gap: 2px; }
.narrow.oC .gh { display: flex; padding: 0 4px 0 6px; margin: 0; border: 0; }
.narrow.oC .gh span { display: none; }
.narrow.oC .ngroup + .ngroup { padding-left: 8px; border-left: 1px solid var(--border); height: 24px; }
.narrow.oC .gh svg { color: var(--muted); width: 16px; height: 16px; }
</style>

<main>
  <header>
    <h1>Admin side menu: Option C at three heading sizes</h1>
    <p>Issue #244. Option C: an outline icon leads each heading, with a rule under it. Only the heading size changes between the three. The current page is Model prices.</p>
  </header>
  <div id="root"></div>
</main>

<script>
const ICON = {
  access: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.4-2.4 2.2-3.8 4.5-3.8s4.1 1.4 4.5 3.8"/><path d="M11 3.4a2.4 2.4 0 0 1 0 4.4M12.6 10c1.2.5 1.9 1.6 2.1 3.2"/></svg>',
  server: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="4.5" rx="1"/><rect x="2" y="9" width="12" height="4.5" rx="1"/><path d="M4.5 4.75h.01M4.5 11.25h.01"/></svg>',
  activity: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8h3l2-5 3 10 2-5h3"/></svg>'
};
const NAV = [
  { name: "People and access", icon: "access", items: [["People", 12], ["Groups", 3], ["Reporters", 5]] },
  { name: "Server", icon: "server", items: [["Settings"], ["Model prices"], ["Reporting"]] },
  { name: "Activity", icon: "activity", items: [["Spend"], ["Admin log"]] }
];
const OPTS = [
  { k: "C", cls: "s14", title: "C1. Heading at 14 px", note: "One step up from today's 12 px. Icon 15 px." },
  { k: "C", cls: "s16", title: "C2. Heading at 16 px", note: "Matches the weight of a page title's neighbor: clearly larger than the 13 px page buttons. Icon 17 px." },
  { k: "C", cls: "s18", title: "C3. Heading at 18 px", note: "The largest. Headings start to compete with the page title, so this is the upper limit." }
];
function menu(opt, layout, theme) {
  const groups = NAV.map(g => `
    <div class="ngroup" role="group" aria-label="${g.name}">
      <span class="gh" aria-hidden="true">${ICON[g.icon]}<span>${g.name}</span></span>
      ${g.items.map(([name, n]) => `<button class="navbtn" ${name === "Model prices" ? 'aria-current="page"' : ""}>${name}${n !== undefined ? `<span class="n">${n}</span>` : ""}</button>`).join("")}
    </div>`).join("");
  return `<div class="fr ${layout} o${opt.k} ${opt.cls} t-${theme}"><nav class="nav"><div class="navin">${groups}
    <div class="navfoot"><button class="lock">Lock Admin</button><span class="hint">Locks after 10 minutes without activity.</span></div></div></nav></div>`;
}
document.getElementById("root").innerHTML = OPTS.map(o => `
  <section class="opt">
    <div><h2>${o.title}</h2><p>${o.note}</p></div>
    <div class="grid">
      ${["light", "dark"].map(t => `<div><div class="cap">Wide, ${t}</div><div class="stage">${menu(o, "wide", t)}</div></div>`).join("")}
    </div>
    <div class="strips">
      ${["light", "dark"].map(t => `<div><div class="cap">760 px and narrower, ${t}</div><div class="stage" style="overflow-x:auto">${menu(o, "narrow", t)}</div></div>`).join("")}
    </div>
  </section>`).join("");
</script>
