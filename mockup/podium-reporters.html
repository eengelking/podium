<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podium Reporters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frontend/src/fleet/tokens.css">
<style>/* Demo-only values, built from the app tokens. */
body { --warnbg: color-mix(in srgb, var(--warn) 10%, transparent); }
/* Layout: a new tab in the Admin view, next to People, Groups and the Admin log (mockup/podium-people.html).
   The list is one row per machine that has ever reported, kept after its sessions are gone. The one loud element is the
   state column: a dot and a word, with a count of each state above the table that doubles as the filter. Everything else
   stays in Podium's own quiet tokens. Clicking a row opens the detail in place, with a way back to the list.
   "Silent" means the server has heard nothing for a while. It does not mean the reporter is turned off, and the page says so.
   Admin only: it shows machine names and source addresses. Dark first, as Podium is. Example data only.
   Issue #166 addition: a reporter that reports with the admin secret instead of its own person token is flagged everywhere
   it appears. The warning is always on, even on a one-person setup: a Token column with an "Admin secret" badge in the warning
   color, a banner above the list that counts them and filters to them, and a callout at the top of the reporter's detail that
   says what is wrong and how to fix it. The warning color is the status color, never the accent, and is always paired with
   an icon and words.
   Issue #167 additions: a checkbox column and a selection bar for removing many reporters in one step (with "select all that
   match" past one page, and "Remove all <state>" beside the search); an Ignore action on a reporter and an "Ignore rules" list
   under the table, each rule removable; and, in Settings, "Forget old reporters", off by default. Ignoring means refusing:
   the server turns the reporter's reports away, so its sessions stop appearing on the fleet until the rule is removed, and the
   page says so wherever a rule is made. */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--sonnet); outline-offset: 1px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }

.app { min-height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
.top { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.logo { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--raised); font-size: 12px; font-weight: 500; }
.btn:hover { background: var(--sel); }
.btn[aria-pressed="true"] { background: var(--sel); border-color: var(--axis); }
.btn.sm { padding: 3px 8px; font-size: 11.5px; }
.btn.dng { color: var(--crit-text); }
.btn.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mock { padding: 5px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; }

.adminv { padding: 18px 16px 32px; }
.wrap { max-width: 1060px; margin: 0 auto; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
.lead { color: var(--ink2); margin: 4px 0 0; max-width: 64ch; }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; min-width: 0; }
.hint { color: var(--muted); font-size: 12px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; }
.tab { padding: 9px 14px; font-weight: 500; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tab .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; }

/* state strip: counts that filter */
.states { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
.sbtn { background: var(--surface); padding: 10px 14px; display: grid; gap: 2px; min-width: 0; }
.sbtn:hover { background: var(--hover); }
.sbtn[aria-pressed="true"] { background: var(--sel); box-shadow: inset 0 -2px 0 var(--ink); }
.sbtn .k { display: flex; align-items: center; gap: 7px; color: var(--ink2); font-size: 12px; }
.sbtn .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
.dot.reporting { background: var(--good); animation: pulse 1.8s ease-out infinite; }
.dot.idle { background: transparent; border: 2px solid var(--good); }
.dot.silent { background: var(--serious); }
.dot.restart { background: transparent; border: 2px solid var(--muted); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(12,163,12,.55); } 70% { box-shadow: 0 0 0 6px rgba(12,163,12,0); } 100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); } }
@media (prefers-reduced-motion: reduce) { .dot.reporting { animation: none; } }
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12.5px; }
.st.reporting, .st.idle { color: var(--good-text); } .st.silent { color: var(--serious); } .st.restart { color: var(--muted); }

.ptool { display: flex; gap: 10px 16px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.ptool .field { flex: 1 1 auto; min-width: 0; width: auto; }
.ptool .f { display: grid; gap: 4px; }
.ptool .grow { flex: 1 1 240px; max-width: 360px; }
.field { background: var(--raised); border: 1px solid var(--border); color: var(--ink); border-radius: 6px; padding: 7px 10px; font: inherit; width: 100%; }
select.field { width: auto; padding: 5px 8px; font-size: 12px; }

.ptab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ptab th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11.5px; padding: 8px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
.ptab th button { display: inline-flex; gap: 4px; align-items: center; color: inherit; font-weight: inherit; }
.ptab th button:hover { color: var(--ink); }
.ptab td { padding: 9px 14px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
.ptab tr:last-child td { border-bottom: 0; }
.ptab tbody tr.rw { cursor: pointer; }
.ptab tbody tr.rw:hover td { background: var(--hover); }
.ptab .nm { font-weight: 600; background: none; display: block; }
.ptab .sub { color: var(--muted); font-size: 11.5px; }
.tw2 { overflow-x: auto; }
.tw2.scroll { max-height: min(62vh, 640px); overflow: auto; }
.num { text-align: right; }
.empty { padding: 22px 14px; color: var(--muted); }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 9px 14px; border-top: 1px solid var(--border); color: var(--ink2); font-size: 12px; }

.compat { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.compat.ok { color: var(--ink2); } .compat.outdated, .compat.newer { color: var(--warn); } .compat.unknown { color: var(--muted); }
.chip { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 4px; font-size: 11.5px; font-weight: 500; border: 1px solid var(--border); white-space: nowrap; color: var(--ink2); }
.chip.mono { font-size: 11px; }

.note { padding: 10px 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.note b { color: var(--ink2); font-weight: 600; }

/* detail */
.dhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; padding: 14px; border-bottom: 1px solid var(--border); }
.dhead h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); font-size: 12.5px; padding: 12px 14px 0; }
.back:hover { color: var(--ink); }
.dgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--border); }
@media (max-width: 900px) { .dgrid { grid-template-columns: minmax(0, 1fr); } }
.dsec { background: var(--surface); padding: 12px 14px 14px; min-width: 0; }
.dsec h3 { margin: 0 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--axis); font-size: 14px; font-weight: 650; letter-spacing: -0.01em; color: var(--ink); }
.kv { display: grid; grid-template-columns: minmax(84px, 34%) minmax(0, 1fr); gap: 6px 12px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; color: var(--ink); word-break: break-word; }
.dsecs { display: grid; gap: 20px; padding: 20px 14px 14px; background: var(--bg); border-top: 1px solid var(--border); }
.dsecs .asec { display: grid; gap: 10px; min-width: 0; }
.dsecs .asec h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; color: var(--ink); }
.dsecs .asec p.hint { margin: 2px 0 0; }
.dsecs .dpanel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.apager { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding: 8px 14px; border-top: 1px solid var(--border); color: var(--ink2); font-size: 12px; }
.apager .row2 { display: inline-flex; align-items: center; gap: 8px; }
.rej { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.rej li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 7px 14px; border-top: 1px solid var(--grid); }
.rej .t { color: var(--muted); font-size: 11.5px; }
.rej .bad { color: var(--crit-text); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--ink2); font-size: 12px; }
.adm { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 4px; font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--warn); border: 1px solid var(--warn); background: var(--warnbg); }
.tokid { color: var(--muted); font-size: 11.5px; }
.warnbar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--warnbg); box-shadow: inset 3px 0 0 var(--warn); }
.warnbar svg.i { color: var(--warn); width: 16px; height: 16px; }
.warnbar .tx { flex: 1 1 320px; min-width: 0; color: var(--ink); }
.warnbar .tx b { font-weight: 650; }
.callout { margin: 14px; padding: 12px 14px; border: 1px solid var(--warn); border-radius: 8px; background: var(--warnbg); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; }
.callout svg.i { color: var(--warn); width: 18px; height: 18px; margin-top: 1px; }
.callout h3 { margin: 0; font-size: 14px; font-weight: 650; color: var(--ink); }
.callout p, .callout ol { grid-column: 2; margin: 0; color: var(--ink2); max-width: 70ch; }
.callout ol { padding-left: 18px; display: grid; gap: 2px; }
.callout b { color: var(--ink); font-weight: 600; }
.tt { border-bottom: 1px dotted var(--muted); cursor: help; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--raised); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.35); max-width: 260px; }

/* issue #167: selection, bulk actions, ignore rules, settings */
.ptab th.chk, .ptab td.chk { width: 34px; padding-right: 0; }
.ptab input[type="checkbox"], .setrow input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--ink); cursor: pointer; margin: 0; vertical-align: middle; }
.ptab tbody tr.rw.sel td { background: var(--sel); }
.selbar { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--sel); box-shadow: inset 3px 0 0 var(--ink); }
.selbar .count { font-weight: 650; }
.selbar .grow { flex: 1 1 auto; }
.selmore { padding: 7px 14px; border-bottom: 1px solid var(--border); color: var(--ink2); font-size: 12px; background: var(--raised); }
.selmore button { text-decoration: underline; color: var(--ink); font-weight: 600; }
.ptool .btn { white-space: nowrap; }
.rules { border-top: 1px solid var(--border); }
.rules h3 { margin: 0; padding: 12px 14px 4px; font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
.rules .lead2 { margin: 0; padding: 0 14px 10px; color: var(--ink2); max-width: 78ch; }
.rules .none { padding: 0 14px 12px; color: var(--muted); }
.ruleform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--grid); }
.ruleform select.field, .ruleform input.field { width: auto; }
.ruleform input.field { flex: 1 1 200px; max-width: 320px; }
.ignform { margin: 0 14px 14px; padding: 12px 14px; border: 1px solid var(--axis); border-radius: 8px; display: grid; gap: 8px; max-width: 640px; }
.ignform label.opt { display: flex; gap: 8px; align-items: flex-start; }
.ignform .warnline { color: var(--warn); display: flex; gap: 8px; align-items: flex-start; }
.setrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 14px; }
.setrow h3 { margin: 0 0 2px; font-size: 14px; font-weight: 650; }
.setrow p { margin: 0; color: var(--ink2); max-width: 70ch; }
.setrow .ctl { display: flex; gap: 10px; align-items: center; }
.setrow input.num { width: 72px; text-align: right; }
.setrow .saved { color: var(--good-text); font-size: 12px; min-height: 1em; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="logo">Podium</span>
    <span class="spacer"></span>
    <button type="button" class="btn" id="themeBtn" aria-pressed="false">Switch theme</button>
    <button type="button" class="btn" aria-pressed="true">Back to fleet</button>
  </header>
  <div class="mock">
    <span>Mockup, example data. The Admin view is open and unlocked.</span>
    <button type="button" class="btn sm" id="stopBtn">Simulate: studio-m2 stops reporting</button>
    <button type="button" class="btn sm" id="resetBtn">Reset</button>
  </div>
  <main class="adminv">
    <div class="wrap">
      <div><h1>Admin</h1><p class="lead">Create and revoke the tokens people use to report to this Podium, and check which machines are reporting.</p></div>
      <section class="box" aria-label="Admin sections">
        <div class="tabs" role="tablist" aria-label="Admin sections" id="tabs"></div>
        <div id="panel" role="tabpanel" aria-labelledby="tab-reporters" tabindex="0"></div>
      </section>
    </div>
  </main>
</div>
<div class="tip" id="tip" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MIN = 60e3, HOUR = 60 * MIN, DAY = 24 * HOUR;
const NOW = Date.now();
/* States, from what the server can see. Thresholds are examples for the mockup. */
const STATE = {
  reporting: { name: "Reporting", def: "Heard from in the last 2 minutes" },
  idle:      { name: "Idle",      def: "Last report 2 minutes to 1 hour ago" },
  silent:    { name: "Silent",    def: "Silent means the server has not heard from this reporter for a while. It does not mean the reporter is turned off: Podium can only see what arrives." },
  restart:   { name: "Not since restart", def: "Not since restart is what every reporter reads after this server restarts, until it reports again. Most rows show it for a short while after a restart; it does not mean they stopped." }
};
const SERVER_STARTED = NOW - 3 * HOUR;
const skewOf = (r) => (A.stopped && r.id === "9f3a1c7d2e40" ? 3 * HOUR : 0);
const isAdmin = (r) => r.tok === "admin secret";
const stateOf = (r) => { if (r.last < SERVER_STARTED) return "restart"; const age = NOW + skewOf(r) - r.last; return age < 2 * MIN ? "reporting" : age < HOUR ? "idle" : "silent"; };

/* key: machine id when the reporter names itself, else the source address */
const DATA = [
  { key: "9f3a1c7d2e40", name: "studio-m2", id: "9f3a1c7d2e40", addr: "192.168.1.24", who: "Dana Ortiz", tok: "pdm_3f9a1c07b2e4", first: NOW - 41 * DAY, last: NOW - 20e3, ver: "0.13.0", eng: "2.1.299", compat: "ok", sessions: 142, live: 3,
    opts: [["Server URL", "http://podium.lan:3117"], ["Report interval", "5 s"], ["Send file names", "off"], ["Send tool names", "on"], ["User name", "Dana Ortiz"]],
    recent: [["api-gateway", "running", "2 min ago", "$1.84"], ["docs-site", "running", "now", "$0.42"], ["infra", "running", "now", "$0.09"], ["migrate-db", "ended", "3 h ago", "$6.10"], ["lint-sweep", "ended", "yesterday", "$0.77"]], rej: [] },
  { key: "b81e0d44a6c2", name: "ci-runner-2", id: "b81e0d44a6c2", addr: "10.4.0.17", who: "Sam Rivera", tok: "pdm_a41d90c6e871", first: NOW - 12 * DAY, last: NOW - 14 * MIN, ver: "0.12.1", eng: "2.1.288", compat: "ok", sessions: 58, live: 0,
    opts: [["Server URL", "http://podium.lan:3117"], ["Report interval", "10 s"], ["Send file names", "off"], ["Send tool names", "off"], ["User name", "Sam Rivera"]],
    recent: [["nightly-eval", "ended", "14 min ago", "$3.21"], ["nightly-eval", "ended", "yesterday", "$3.08"]], rej: [] },
  { key: "5c27f9ab01de", name: "air-travel", id: "5c27f9ab01de", addr: "172.20.8.203", who: "Dana Ortiz", tok: "pdm_3f9a1c07b2e4", first: NOW - 90 * DAY, last: NOW - 33 * DAY, ver: "0.9.2", eng: "2.0.71", compat: "outdated", sessions: 31, live: 0,
    opts: [["Server URL", "http://podium.lan:3117"], ["Report interval", "5 s"], ["Send file names", "on"], ["Send tool names", "on"], ["User name", "Dana Ortiz"]],
    recent: [], rej: [] },
  { key: "addr:10.4.0.52", name: "legacy-job", id: null, addr: "10.4.0.52", who: "Admin", tok: "admin secret", first: NOW - 6 * DAY, last: NOW - 2 * HOUR - 10 * MIN, ver: "0.13.0", eng: "2.1.299", compat: "ok", sessions: 9, live: 0,
    opts: [["Server URL", "http://podium.lan:3117"], ["Report interval", "5 s"], ["User name", "not set"]],
    recent: [["legacy-job", "ended", "2 h ago", "$0.30"]], rej: [["2 h ago", "Refused: reporting with the admin secret is turned off"], ["2 h ago", "Refused: reporting with the admin secret is turned off"]] },
  { key: "addr:10.88.0.128", name: "eengelking/podium", id: null, addr: "10.88.0.128", who: "Admin", tok: "admin secret", first: NOW - 2 * DAY, last: NOW - 8e3, ver: "0.13.0", eng: "2.1.299", compat: "ok", sessions: 101, live: 2,
    opts: [["Server URL", "http://podium.lan:3117"], ["Report interval", "5 s"], ["User name", "not set"]],
    recent: [["podium", "running", "now", "$2.31"], ["podium", "ended", "3 h ago", "$4.02"]], rej: [] },
  { key: "e20b7733c9f5", name: "pi-garage", id: "e20b7733c9f5", addr: "192.168.1.61", who: "Lee Park", tok: "pdm_7be2058d3c19", first: NOW - 70 * DAY, last: NOW - 40 * DAY, ver: "0.14.0", eng: "2.2.4", compat: "newer", sessions: 17, live: 0,
    opts: [["Server URL", "http://podium.lan:3117"], ["Report interval", "30 s"], ["User name", "Lee Park"]],
    recent: [], rej: [] },
  { key: "hooks:192.168.1.88", name: "Hooks only", id: null, addr: "192.168.1.88", who: "Lee Park", tok: "pdm_7be2058d3c19", first: NOW - 20 * DAY, last: NOW - 5 * HOUR, ver: "hooks", eng: "n/a", compat: "unknown", sessions: 4, live: 0,
    opts: [["Reports through", "Claude Code settings hooks, no mod installed"]],
    recent: [["scratch", "ended", "5 h ago", "$0.11"]], rej: [] }
];

const A = { rows: DATA.map((r) => ({ ...r })), stopped: false, filter: "all", onlyAdmin: false, q: "", sort: "last", dir: -1, open: null, confirm: false, removed: [], sel: [], bulk: false, tab: "reporters", rules: [], ign: null, forget: { on: false, days: 30 }, saved: "" };

const ago = (t, r) => { const d = NOW + (r ? skewOf(r) : 0) - t; if (d < 15e3) return "just now"; if (d < MIN) return Math.round(d / 1e3) + " s ago"; if (d < HOUR) return Math.round(d / MIN) + " min ago"; if (d < DAY) return Math.round(d / HOUR) + " h ago"; return Math.round(d / DAY) + " days ago"; };
const date = (t) => new Date(t).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
const COMPAT = {
  ok: ["ok", "Supported"], outdated: ["outdated", "Older than supported. Update the mod."], newer: ["newer", "Newer than this server knows. Update Podium."], unknown: ["unknown", "No version to check"]
};
const compatHtml = (r) => { const [c, t] = COMPAT[r.compat]; return `<span class="compat ${c}" data-hint="${esc(t)}">${c === "outdated" || c === "newer" ? "⚠ " : ""}<span class="mono">${esc(r.ver)}</span>${c === "outdated" || c === "newer" ? " " + c : c === "unknown" ? " no mod" : ""}</span>`; };
const stHtml = (r) => { const s = stateOf(r); return `<span class="st ${s}" data-hint="${esc(STATE[s].def + "")}"><span class="dot ${s}"></span>${STATE[s].name}</span>`; };

const WARN_ICON = `<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2L14.4 13H1.6L8 2.2z"/><path d="M8 6.6v3"/><path d="M8 11.4v.1"/></svg>`;
const ADMIN_HINT = "This reporter sends the admin secret instead of a token made for a person. Anyone holding it can report as anyone, and its sessions belong to no one. Make a token for this person in Admin > People, then enter it, and their name, in the reporter's options.";
const tokHtml = (r) => isAdmin(r)
  ? `<span class="adm" tabindex="0" data-hint="${esc(ADMIN_HINT)}">${WARN_ICON}Admin secret</span>`
  : `<span class="tokid mono">${esc(r.tok)}</span>`;

function visible() {
  const q = A.q.trim().toLowerCase();
  let rows = A.rows.filter((r) => !A.removed.includes(r.key)).filter((r) => A.filter === "all" || stateOf(r) === A.filter)
    .filter((r) => !A.onlyAdmin || isAdmin(r))
    .filter((r) => !q || [r.name, r.who, r.addr, r.id || "", r.ver].some((s) => s.toLowerCase().includes(q)));
  const get = { name: (r) => r.name.toLowerCase(), state: (r) => ["reporting", "idle", "silent", "restart"].indexOf(stateOf(r)), ver: (r) => r.ver, last: (r) => r.last, sessions: (r) => r.sessions, who: (r) => r.who.toLowerCase(), tok: (r) => (isAdmin(r) ? "0" : "1") + r.tok }[A.sort];
  return rows.sort((a, b) => (get(a) < get(b) ? -1 : get(a) > get(b) ? 1 : 0) * A.dir);
}
const th = (id, label, cls = "") => `<th class="${cls}" aria-sort="${A.sort === id ? (A.dir > 0 ? "ascending" : "descending") : "none"}"><button type="button" data-sort="${id}">${label}${A.sort === id ? (A.dir > 0 ? " ↑" : " ↓") : ""}</button></th>`;

function listHtml() {
  const all = A.rows.filter((r) => !A.removed.includes(r.key));
  const cnt = (s) => all.filter((r) => stateOf(r) === s).length;
  const rows = visible();
  const strip = [["all", "All reporters", all.length, ""], ...["reporting", "idle", "silent", "restart"].map((s) => [s, STATE[s].name, cnt(s), s])]
    .map(([id, label, n, dot]) => `<button type="button" class="sbtn" data-filter="${id}"${STATE[id] ? ` data-hint="${esc(STATE[id].def)}"` : ""} aria-pressed="${A.filter === id}"><span class="k">${dot ? `<span class="dot ${dot}"></span>` : ""}${label}</span><span class="v mono">${n}</span></button>`).join("");
  const nAdmin = all.filter(isAdmin).length;
  const banner = nAdmin ? `<div class="warnbar" role="status">${WARN_ICON}<div class="tx"><b>${nAdmin} ${nAdmin === 1 ? "reporter uses" : "reporters use"} the admin secret.</b> They should each use a token made for one person, so their sessions have an owner and the admin secret stays private.</div><button type="button" class="btn sm" data-act="admin-filter" aria-pressed="${A.onlyAdmin}">${A.onlyAdmin ? "Show all reporters" : "Show only these"}</button></div>` : "";
  return `<div class="states" role="group" aria-label="Filter by state">${strip}</div>${banner}
  <div class="ptool"><label for="rq" style="font-weight:600;white-space:nowrap">Find a reporter</label><input class="field" id="rq" type="search" placeholder="Machine, person, address or version" value="${esc(A.q)}">${A.filter !== "all" && rows.length ? `<button type="button" class="btn sm dng" data-act="state-all">Remove all ${STATE[A.filter].name} (${cnt(A.filter)})</button>` : ""}</div>
  ${selBar(rows)}
  ${rows.length ? `<div class="tw2 scroll"><table class="ptab"><thead><tr><th class="chk"><input type="checkbox" aria-label="Select all ${rows.length} on this page" data-selall ${rows.length && rows.every((r) => A.sel.includes(r.key)) ? "checked" : ""}></th>${th("state", "State")}${th("name", "Machine")}${th("who", "Person")}${th("tok", "Token")}${th("ver", "Reporter version")}${th("last", "Last report")}${th("sessions", "Sessions", "num")}</tr></thead>
    <tbody>${rows.map((r) => `<tr class="rw${A.sel.includes(r.key) ? " sel" : ""}" tabindex="0" data-open="${esc(r.key)}" aria-label="Open details for ${esc(r.name)}"><td class="chk"><input type="checkbox" aria-label="Select ${esc(r.name)}" data-sel="${esc(r.key)}" ${A.sel.includes(r.key) ? "checked" : ""}></td><td>${stHtml(r)}</td>
      <td><span class="nm">${esc(r.name)}</span><span class="sub mono">${esc(r.id ? r.addr : "no machine id, matched by address " + r.addr)}</span></td>
      <td>${esc(r.who)}</td><td>${tokHtml(r)}</td><td>${compatHtml(r)}</td><td class="mono" style="color:var(--ink2);white-space:nowrap">${ago(r.last, r)}</td>
      <td class="num mono">${r.sessions}${r.live ? ` <span class="hint">· ${r.live} live</span>` : ""}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="empty">${all.length ? "No reporter matches. Clear the search or pick another state." : "No reporter has connected yet. Install podium-reporter and point it at this server."}</div>`}
  <div class="pager"><span>${rows.length} of ${all.length} reporters</span><span class="hint">Page 1 of 1</span></div>
  ${rulesHtml()}`;
}

function selBar(rows) {
  if (!A.sel.length) return "";
  const n = A.sel.length, plural = n === 1 ? "reporter" : "reporters";
  const matching = visible().length;
  const more = rows.length && rows.every((r) => A.sel.includes(r.key)) && n < matching ? `<div class="selmore">All ${n} on this page are selected. <button type="button" data-act="sel-matching">Select all ${matching} that match</button></div>` : "";
  const bar = A.bulk
    ? `<div class="selbar" role="group" aria-label="Confirm removal"><span>Remove ${n} ${plural} from the list? They come back if they report again, unless ignored. Their sessions are not touched.</span><span class="grow"></span><button type="button" class="btn sm dng" data-act="bulk-yes">Remove ${n} ${plural}</button><button type="button" class="btn sm" data-act="bulk-no">Keep them</button></div>`
    : `<div class="selbar" role="group" aria-label="Selected reporters"><span class="count">${n} selected</span><span class="grow"></span><button type="button" class="btn sm dng" data-act="bulk">Remove ${n}…</button><button type="button" class="btn sm" data-act="sel-clear">Clear selection</button></div>`;
  return bar + more;
}

const KIND = { key: "Key", address: "Address", version: "Version" };
function rulesHtml() {
  const rows = A.rules.map((x, i) => `<tr><td>${KIND[x.kind]}</td><td class="mono">${esc(x.pattern)}</td><td class="mono" style="color:var(--ink2)">${esc(x.added)}</td><td class="num"><button type="button" class="btn sm" data-rule-del="${i}" aria-label="Remove the rule for ${esc(x.pattern)}">Remove rule</button></td></tr>`).join("");
  return `<section class="rules" aria-labelledby="rules-h" style="margin-top:20px"><h2 id="rules-h" style="margin:0;font-size:15px;font-weight:650">Ignore rules</h2>
  <p class="hint" style="margin:2px 0 8px">A reporter that matches a rule is refused. Its sessions stop appearing on the fleet until you remove the rule. Use <span class="mono">*</span> for “anything”, as in <span class="mono">10.88.*</span> or <span class="mono">*-sim</span>.</p>
  ${A.rules.length ? `<div class="tw2"><table class="ptab"><thead><tr><th>Matches</th><th>Pattern</th><th>Added</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="none">No rules. Every reporter is accepted.</div>`}
  <form class="ruleform" data-ruleform><label for="rk" class="hint">Add a rule</label><select class="field" id="rk"><option value="key">Key</option><option value="address">Address</option><option value="version">Version</option></select><input class="field mono" id="rp" placeholder="10.88.* or *-sim" aria-label="Pattern"><button type="submit" class="btn sm">Ignore matching reporters</button></form></section>`;
}

function settingsHtml() {
  const f = A.forget;
  return `<div class="setrow"><div><h3>Forget old reporters</h3><p>Remove a reporter from the list once the server has not heard from it for this many days. Its sessions are not touched, and it comes back if it reports again.</p></div>
  <div class="ctl"><label><input type="checkbox" data-forget-on ${f.on ? "checked" : ""}> On</label><label class="hint" for="fd">After</label><input class="field mono num" id="fd" type="number" min="1" max="3650" value="${f.days}" data-forget-days><span class="hint">days</span></div>
  <div class="saved" role="status">${esc(A.saved)}</div></div>`;
}

function detailHtml(r) {
  const s = stateOf(r);
  const kv = (rows) => `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
  const [cc, ct] = COMPAT[r.compat];
  const rem = A.confirm
    ? `<div class="confirm">Remove ${esc(r.name)} from the list? It comes back if it reports again. Its sessions are not touched.<button type="button" class="btn sm dng" data-act="remove-yes">Remove reporter</button><button type="button" class="btn sm" data-act="remove-no">Keep it</button></div>`
    : `<button type="button" class="btn sm dng" data-act="remove" data-hint="Remove from list takes the row away and nothing else: the sessions stay, and the reporter comes back the next time it reports. To keep one off the list, ignore it. That turns its reports away.">Remove from list</button>`;
  const ign = A.ign
    ? `<form class="ignform" data-ignform><b>Ignore ${esc(r.name)}?</b><label class="opt"><input type="radio" name="ik" value="key" checked> <span>This reporter only <span class="hint mono">${esc(r.key)}</span></span></label><label class="opt"><input type="radio" name="ik" value="address"> <span>Everything from its address <span class="hint mono">${esc(r.addr)}</span></span></label><label class="opt"><input type="radio" name="ik" value="version"> <span>Every reporter on version <span class="hint mono">${esc(r.ver)}</span></span></label>
      <div class="warnline">${WARN_ICON}<span>Its reports are turned away, so its sessions stop appearing on the fleet. You can undo this from the Ignore rules list.</span></div><div class="confirm"><button type="submit" class="btn sm dng">Ignore and remove</button><button type="button" class="btn sm" data-act="ign-no">Cancel</button></div></form>` : "";
  return `<button type="button" class="back" data-act="back"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>All reporters</button>
  <div class="dhead"><div><h2>${esc(r.name)} ${stHtml(r)}${isAdmin(r) ? " " + tokHtml(r) : ""}</h2></div><div class="confirm">${A.ign ? "" : `<button type="button" class="btn sm" data-act="ign" data-hint="Ignore… asks what to ignore first: this reporter only, everything from its address, or every reporter on its version. Nothing happens until you confirm.">Ignore…</button>`}${rem}</div></div>${ign}
  ${isAdmin(r) ? `<div class="callout" role="alert">${WARN_ICON}<h3>This reporter is using the admin secret</h3>
    <p>${esc(r.name)} reports with the admin secret instead of a token made for one person. Its ${r.sessions} sessions belong to no one, and anyone who holds that secret can report as anyone. On a server only you use this is allowed, but it is not meant to stay that way.</p>
    <p><b>To fix it:</b></p>
    <ol><li>In Admin > People, make a person for whoever runs this reporter, and copy their token.</li><li>In Claude Code on ${esc(r.addr)}, run <span class="mono">/plugin configure podium-reporter</span>.</li><li>Enter that token as <span class="mono">token</span> and the person's name as <span class="mono">userName</span>.</li></ol></div>` : ""}
  <div class="dgrid">
    <section class="dsec"><h3>Reporter</h3>${kv([
      ["Version", `<span class="mono">${esc(r.ver)}</span>`], ["Compatibility", `<span class="compat ${cc}">${cc === "ok" ? "Supported" : esc(ct)}</span>`],
      ["Claude Code", `<span class="mono">${esc(r.eng)}</span>`], ["First seen", `${date(r.first)} <span class="hint">(${ago(r.first)})</span>`], ["Last report", `${ago(r.last, r)}`], ["Sessions seen", `<span class="tt" data-hint="Totals outlive the sessions themselves, which are deleted 30 days after they end."><span class="mono">${r.sessions}</span> in total, ${r.live} running now</span>`]])}</section>
    <section class="dsec"><h3>Where it comes from</h3>${kv([
      ["Machine", esc(r.name)], ["Machine id", r.id ? `<span class="mono">${esc(r.id)}</span>` : `<span class="tt" data-hint="The reporter has no user name set, so it sends no machine id and is matched by source address.">Not sent</span>`],
      ["Source address", `<span class="mono">${esc(r.addr)}</span>`], ["Person", esc(r.who)], ["Token", isAdmin(r) ? tokHtml(r) : `<span class="mono tt" data-hint="The token's key id, which finds the person. The secret part is never shown or kept.">${esc(r.tok)}</span>`]])}</section>
    <section class="dsec"><h3>Options it reports</h3>${kv(r.opts.map(([k, v]) => [esc(k), esc(v)]))}</section>
  </div>
  <div class="dsecs">
    <section class="asec" aria-labelledby="rs-h"><div><h2 id="rs-h">Recent sessions</h2><p class="hint">The sessions this reporter sent that the server still holds, newest first.</p></div>
      <div class="dpanel">${r.recent.length ? `<table class="ptab"><thead><tr><th>Session</th><th>State</th><th>Last report</th><th class="num">Cost</th></tr></thead><tbody>${r.recent.map(([n, st, t, c]) => `<tr><td class="nm" style="font-weight:600">${esc(n)}</td><td>${esc(st)}</td><td class="mono" style="color:var(--ink2)">${esc(t)}</td><td class="num mono">${esc(c)}</td></tr>`).join("")}</tbody></table>
        <div class="apager"><span class="hint" role="status">Showing 1 to ${r.recent.length} of ${r.sessions}</span><span class="row2"><label class="hint">Rows per page</label><select class="field sm"><option>25</option><option>50</option><option>100</option></select><button type="button" class="btn sm" disabled>Previous</button><span class="hint">Page 1 of ${Math.max(1, Math.ceil(r.sessions / 25))}</span><button type="button" class="btn sm"${r.sessions > 25 ? "" : " disabled"}>Next</button></span></div>` : `<div class="empty"><span class="tt" data-hint="Sessions are deleted 30 days after they end.">No sessions left.</span></div>`}</div></section>
    <section class="asec" aria-labelledby="rj-h"><div><h2 id="rj-h">Reports the server turned away</h2><p class="hint">The latest refusals from this reporter's address. The server keeps them in memory only, so a restart clears them.</p></div>
      <div class="dpanel">${r.rej.length ? `<ul class="rej">${r.rej.map(([t, m]) => `<li><span class="t mono">${esc(t)}</span><span class="bad">${esc(m)}</span></li>`).join("")}</ul>` : `<div class="empty">None lately.</div>`}</div></section>
  </div>`;
}

function render() {
  const n = A.rows.filter((r) => !A.removed.includes(r.key)).length;
  $("#tabs").innerHTML = [["people", "People", 4], ["groups", "Groups", 3], ["reporters", "Reporters", n], ["reporting", "Reporting and security", null], ["settings", "Settings", null], ["log", "Admin log", 12]]
    .map(([id, name, c]) => `<button type="button" role="tab" class="tab" id="tab-${id}" aria-selected="${id === A.tab}" tabindex="${id === A.tab ? 0 : -1}" data-tab="${id}">${name}${c === null ? "" : `<span class="n">${c}</span>`}</button>`).join("");
  const r = A.open && A.rows.find((x) => x.key === A.open);
  const had = document.activeElement && document.activeElement.id;
  $("#panel").innerHTML = A.tab === "settings" ? settingsHtml() : r ? detailHtml(r) : listHtml();
  if (had === "rq") { const i = $("#rq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
const live = () => A.rows.filter((r) => !A.removed.includes(r.key));
const globRe = (p) => new RegExp("^" + p.split("*").map((x) => x.replace(/[.+?^${}()|[\]\\]/g, "\\$&")).join(".*") + "$", "i");
function addRule(kind, pattern) {
  pattern = pattern.trim(); if (!pattern) return;
  if (!A.rules.some((x) => x.kind === kind && x.pattern === pattern)) A.rules.push({ kind, pattern, added: "just now" });
  const re = globRe(pattern), field = { key: "key", address: "addr", version: "ver" }[kind];
  live().filter((r) => re.test(r[field] || "")).forEach((r) => A.removed.push(r.key));
  A.sel = A.sel.filter((k) => !A.removed.includes(k));
}
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.selall !== undefined) { const keys = visible().map((r) => r.key); A.sel = t.checked ? [...new Set([...A.sel, ...keys])] : A.sel.filter((k) => !keys.includes(k)); A.bulk = false; render(); }
  else if (t.dataset.sel) { A.sel = t.checked ? [...A.sel, t.dataset.sel] : A.sel.filter((k) => k !== t.dataset.sel); A.bulk = false; render(); }
  else if (t.dataset.forgetOn !== undefined) { A.forget.on = t.checked; A.saved = t.checked ? `Saved. Reporters not heard from for ${A.forget.days} days are removed at the next hourly check.` : "Saved. Reporters are kept until you remove them."; render(); }
  else if (t.dataset.forgetDays !== undefined) { const n = Math.round(Number(t.value)); if (n >= 1 && n <= 3650) { A.forget.days = n; A.saved = "Saved."; } else A.saved = "Enter a whole number of days from 1 to 3650."; render(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.dataset.ruleform !== undefined) { addRule($("#rk").value, $("#rp").value); render(); }
  else if (e.target.dataset.ignform !== undefined) { const r = A.rows.find((x) => x.key === A.open); const k = e.target.elements.ik.value; addRule(k, k === "key" ? r.key : k === "address" ? r.addr : r.ver); A.open = null; A.ign = null; render(); }
});
document.addEventListener("click", (e) => {
  const rd = e.target.closest("[data-rule-del]"); if (rd) { A.rules.splice(Number(rd.dataset.ruleDel), 1); render(); return; }
  const tb = e.target.closest("[data-tab]"); if (tb) { A.tab = tb.dataset.tab === "settings" ? "settings" : "reporters"; A.open = null; render(); return; }
  if (e.target.closest("input[type=checkbox],form")) { if (!e.target.closest("[data-act]")) return; }
  const t = e.target.closest("[data-filter],[data-sort],[data-open],[data-act]"); if (!t) return;
  if (t.dataset.filter) A.filter = t.dataset.filter;
  else if (t.dataset.sort) { A.dir = A.sort === t.dataset.sort ? -A.dir : 1; A.sort = t.dataset.sort; }
  else if (t.dataset.open) { A.open = t.dataset.open; A.confirm = false; }
  else if (t.dataset.act === "back") { const k = A.open; A.open = null; A.confirm = false; A.ign = null; render(); const row = document.querySelector(`[data-open="${k}"]`); if (row) row.focus(); return; }
  else if (t.dataset.act === "admin-filter") A.onlyAdmin = !A.onlyAdmin;
  else if (t.dataset.act === "remove") A.confirm = true;
  else if (t.dataset.act === "remove-no") A.confirm = false;
  else if (t.dataset.act === "bulk") A.bulk = true;
  else if (t.dataset.act === "bulk-no") A.bulk = false;
  else if (t.dataset.act === "bulk-yes") { A.removed.push(...A.sel); A.sel = []; A.bulk = false; }
  else if (t.dataset.act === "sel-clear") { A.sel = []; A.bulk = false; }
  else if (t.dataset.act === "sel-matching") A.sel = visible().map((r) => r.key);
  else if (t.dataset.act === "state-all") { A.sel = visible().map((r) => r.key); A.bulk = true; }
  else if (t.dataset.act === "ign") A.ign = true;
  else if (t.dataset.act === "ign-no") A.ign = null;
  else if (t.dataset.act === "remove-yes") { A.removed.push(A.open); A.open = null; A.confirm = false; }
  render();
  if (A.open) { const b = document.querySelector(".back"); if (b) b.focus(); }
});
document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.rw")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("input", (e) => { if (e.target.id === "rq") { A.q = e.target.value; render(); } });
$("#stopBtn").onclick = () => { A.stopped = true; render(); };
$("#resetBtn").onclick = () => { A.sel = []; A.bulk = false; A.rules = []; A.ign = null; A.tab = "reporters"; A.forget = { on: false, days: 30 }; A.saved = ""; A.stopped = false; A.removed = []; A.filter = "all"; A.onlyAdmin = false; A.q = ""; A.open = null; render(); };
$("#themeBtn").onclick = () => { const d = document.documentElement; const light = d.dataset.theme ? d.dataset.theme === "light" : matchMedia("(prefers-color-scheme: light)").matches; d.dataset.theme = light ? "dark" : "light"; };
const tip = $("#tip");
document.addEventListener("mouseover", (e) => { const h = e.target.closest("[data-hint]"); if (!h) { tip.hidden = true; return; } tip.textContent = h.dataset.hint; tip.hidden = false; const b = h.getBoundingClientRect(); tip.style.left = Math.max(8, Math.min(b.left, innerWidth - 270)) + "px"; const th = tip.offsetHeight; tip.style.top = (b.top - th - 8 >= 8 ? b.top - th - 8 : b.bottom + 8) + "px"; });
render();
</script>
</body>
</html>
