<style>
/* Mockup for #347: My reporters, a console page for a signed-in person. It mirrors Admin > Reporters, shows only that
   person's reporters, and is where they decide which of their reporters may see and message each other. Messaging is
   between one person's own reporters only (the policy finding on #347).
   Two views of the same rights, both accepted by the maintainer, with a Grid | Board switch on the page: Grid shows every
   pair at once; Board shows one reporter's peers in columns you drag them across. The switch is remembered in this browser.
   (A third view, a list of links, was dropped as too complex.)
   The Admin's side is the Reporters detail page in the Admin shell, where a change is only proposed until the owner accepts.
   Built from the app's own parts: the top bar, the Admin page classes, .confirm for consent, .modeseg for a choice of a few,
   .badge, .warnbar, .kb-empty and .kb-blank. Classes that start with pm- are new and would be added to the standards with the
   feature: pm-lv (an access level), pm-os (a system), pm-pend (proposed), pm-state (paused), pm-grid, pm-board.
   Colors and fonts come from tokens.css through fleet.css; this file has no :root block. Example data only.
   #436 (C7) adds the owner's stricter limits to Defaults, inside the dashed box marked "New in #436". Each limit is the
   Admin's setting row from Admin > Settings (.srow, a .field.daysbox, the in-place .err that Forget old reporters uses),
   with the Admin's value as its most, and a Use the Admin's limit button in a .row2 once the owner has their own. The
   Limits buttons in the bar above switch the example. A value is saved when the box loses focus or on Enter, and a
   refused one saves nothing. The dashed box and its caption (mock-new) are for this review only, not app UI. */
html, body { height: auto; }
/* Mockup only: marks the part #436 adds, so the reviewer can find it. Not app UI. */
.mock-new { outline: 2px dashed var(--sonnet); outline-offset: -3px; }
.mock-new > .mock-cap { display: block; padding: 10px 16px 0; font: 600 11px var(--font-ui); color: var(--sonnet); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font-ui); }
.demo { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; background: var(--raised); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--ink2); }
.demo b { color: var(--ink); }
.demo .grp { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.demo button { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font: inherit; font-size: 12px; font-weight: 500; color: var(--ink); cursor: pointer; }
.demo button[aria-pressed="true"] { background: var(--sel); border-color: var(--axis); }
.demo button:focus-visible { outline: 2px solid var(--sonnet); outline-offset: 1px; }
.stage { margin: 0 auto; max-width: var(--stage, 1240px); border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-height: 100vh; background: var(--bg); }
.stage .podium .adminv .apage { overflow: visible; }
/* Approved by the maintainer for #347: more room after "Signed in as Ed", now that a button follows it (16 px in all). */
.podium .tb-who { margin-right: 8px; }
.stage .podium .adminv .shell { height: auto; }
.stage.narrow .podium .adminv .apage { padding: 16px 16px 0; }
.stage.narrow .podium .adminv .shell { grid-template-columns: minmax(0, 1fr); }
.stage.narrow .podium .adminv .nav { display: none; }

/* Consent rows: the app's .confirm, one per request, with the question on the left and a button per answer. */
.pm-reqs { display: grid; gap: 10px; padding: 12px 16px; }
.pm-reqs .confirm { align-items: flex-start; }
.pm-reqs .confirm > .q { flex: 1 1 360px; min-width: 0; display: grid; gap: 4px; color: var(--ink); font-size: 13px; }
.pm-reqs .confirm .hint { color: var(--muted); }
.pm-quote { color: var(--ink2); border-left: 2px solid var(--axis); padding-left: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.pm-quote .rd { background: color-mix(in srgb, var(--crit) 18%, transparent); color: var(--crit-text); border-radius: 3px; padding: 0 3px; }

/* A level is an icon and a word, never a hue. */
.pm-lv { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; color: var(--ink2); }
.pm-lv svg, .pm-os svg, .pm-pend svg, .pm-state svg { width: 14px; height: 14px; flex: none; }
.pm-lv.none { color: var(--muted); }
.pm-lv.send, .pm-lv.ask { color: var(--ink); }
.pm-os { display: inline-flex; align-items: center; gap: 6px; }
.pm-pend { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--warn-text); white-space: nowrap; }
.pm-state { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; }
.pm-state.paused { color: var(--muted); }

.pm-note { padding: 10px 16px; border-top: 1px solid var(--grid); }
.pm-note .hint { margin: 0; }

/* Layout A: the grid. Rows send, columns receive. */
.pm-gridwrap { overflow-x: auto; }
.pm-grid { border-collapse: separate; border-spacing: 0; font-size: 12px; min-width: 660px; width: 100%; }
.pm-grid th, .pm-grid td { padding: 8px 10px; border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); text-align: left; vertical-align: top; }
.pm-grid tr > *:last-child { border-right: 0; }
.pm-grid tbody tr:last-child > * { border-bottom: 0; }
.pm-grid thead th { color: var(--muted); font-weight: 600; background: var(--surface); }
.pm-grid .mn { color: var(--ink); display: block; font-weight: 650; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pm-grid tbody th { font-weight: 650; color: var(--ink); }
.pm-grid tbody th .hint { display: block; font-weight: 400; }
.pm-grid td { background: var(--surface); display: table-cell; }
.pm-grid td > * + * { margin-top: 4px; }
.pm-grid td.self { background-image: repeating-linear-gradient(135deg, transparent 0 6px, var(--hover) 6px 7px); }
.pm-grid td.off { background: var(--raised); }
.pm-grid select { width: 100%; min-width: 160px; }
.pm-grid .cellnote { display: block; }

.pm-back { padding: 0 16px 12px; }

/* Layout B: the board. */
.pm-pick { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--grid); }
.pm-board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 12px 16px 16px; }
.pm-col { border: 1px solid var(--grid); border-radius: 8px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 150px; min-width: 0; background: var(--bg); }
.pm-col.over { border-color: var(--sonnet); background: var(--hover); }
.pm-col h3 { margin: 0; font-size: 12px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.pm-col h3 .n { color: var(--muted); font-weight: 500; margin-left: auto; }
.pm-col > .hint { margin: 0; }
.pm-card { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 9px 10px; display: grid; gap: 6px; cursor: grab; min-width: 0; }
.pm-card.locked { cursor: default; }
.pm-card.dragging { opacity: .5; }
.pm-card .ct { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pm-card .ct b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pm-card .grip { color: var(--muted); margin-left: auto; flex: none; }
.pm-card .sub { font-size: 11px; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; }
.pm-card select { width: 100%; }
.pm-card .backl { font-size: 11px; color: var(--muted); border-top: 1px solid var(--grid); padding-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.stage.narrow .pm-board { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { .pm-board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .pm-board { grid-template-columns: minmax(0, 1fr); } }
</style>

<script>
(function () {

  var I = {

    win: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.5l5-.7v4.7H2zM9 2.6l5-.7v5.6H9zM2 8.5h5v4.7l-5-.7zM9 8.5h5v5.6l-5-.7z"/></svg>',
    none: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M4.2 11.8l7.6-7.6"/></svg>',
    see: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>',
    send: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h10M8.5 4.5L12 8l-3.5 3.5"/><path d="M14 3v10"/></svg>',
    ask: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8h6M5 5l3 3-3 3"/><circle cx="12" cy="8" r="3"/><path d="M12 6.6V8l.9.6"/></svg>',
    arrow: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h11M9.5 4.5L13 8l-3.5 3.5"/></svg>',
    clock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.4"/></svg>',
    pause: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M6.5 5.5v5M9.5 5.5v5"/></svg>',
    warn: '<svg class="wicon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l6.5 11.5h-13z"/><path d="M8 6.5v3M8 11.6v.1"/></svg>',
    grip: '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><circle cx="6" cy="4" r="1"/><circle cx="10" cy="4" r="1"/><circle cx="6" cy="8" r="1"/><circle cx="10" cy="8" r="1"/><circle cx="6" cy="12" r="1"/><circle cx="10" cy="12" r="1"/></svg>',
    gPeople: '<svg class="gi" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5.5" r="2.5"></circle><path d="M1.5 13.5c.4-2.4 2.2-3.8 4.5-3.8s4.1 1.4 4.5 3.8"></path><path d="M11 3.4a2.4 2.4 0 0 1 0 4.4M12.6 10c1.2.5 1.9 1.6 2.1 3.2"></path></svg>',
    gServer: '<svg class="gi" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="4.5" rx="1"></rect><rect x="2" y="9" width="12" height="4.5" rx="1"></rect><path d="M4.5 4.75h.01M4.5 11.25h.01"></path></svg>',
    gAct: '<svg class="gi" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8h3l2-5 3 10 2-5h3"></path></svg>'
  };
  // One label per level, the same in every layout, in the Admin's view and in the terminal.
  var LV = { none: 'No access', see: 'Can see', ask: 'Can send, with approval', send: 'Can send' };
  var ORDER = ['none', 'see', 'ask', 'send'];

  var BASE = [
    { id: 'ed-mbp', os: 'macOS 26.1', k: 'mac', state: 'reporting', st: 'Reporting', local: true, ver: '0.16.0', last: '12 s ago', orch: ['claude-dashboard', 'infra-notes'] },
    { id: 'ci-runner-01', os: 'Ubuntu 24.04', k: 'linux', state: 'reporting', st: 'Reporting', local: true, ver: '0.16.0', last: '40 s ago', orch: ['Tester'] },
    { id: 'build-pi', os: 'Debian 12, arm64', k: 'linux', state: 'reporting', st: 'Reporting', local: true, ver: '0.16.0', last: '1 min ago', orch: ['arm64-check'] },
    { id: 'win-lab', os: 'Windows 11', k: 'win', state: 'silent', st: 'Silent', local: false, ver: '0.15.2', last: '3 days ago', orch: [] }
  ];
  var LONG = { 'ed-mbp': 'ed-macbook-pro-16-inch-2026-home-office', 'ci-runner-01': 'ci-runner-01.lab.internal.example' };
  var REP = BASE;

  function key(a, b) { return a + '>' + b; }
  var RIGHTS = {};
  RIGHTS[key('ed-mbp', 'ed-mbp')] = 'send';
  RIGHTS[key('ed-mbp', 'ci-runner-01')] = 'send';
  RIGHTS[key('ci-runner-01', 'ed-mbp')] = 'send';
  RIGHTS[key('ed-mbp', 'build-pi')] = 'ask';
  RIGHTS[key('build-pi', 'ed-mbp')] = 'see';
  var PROPOSED = {};
  PROPOSED[key('build-pi', 'ed-mbp')] = 'ask';
  var PAUSED = {};
  PAUSED[key('ed-mbp', 'ed-mbp')] = true;
  var S = { layout: 'grid', as: 'owner', trust: false, kase: 'example', boardOf: 'ed-mbp', back: null, adminPaused: false };

  function esc(s) { var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
  function rep(id) { for (var i = 0; i < REP.length; i++) if (REP[i].id === id) return REP[i]; return null; }
  function nm(id) { return S.kase === 'long' && LONG[id] ? LONG[id] : id; }
  // A name in a row is cut with an ellipsis and keeps its full text as a title.
  function name(id, cls) { var n = nm(id); return '<span class="' + (cls || '') + '" title="' + esc(n) + '">' + esc(n) + '</span>'; }
  function get(a, b) {
    if (!rep(a).local || !rep(b).local) return 'none';
    if (S.trust) return 'send';
    return RIGHTS[key(a, b)] || 'none';
  }
  function canSend(l) { return l === 'send' || l === 'ask'; }
  function locked(a, b) { return !rep(a).local || !rep(b).local || S.trust; }
  function lv(level) { return '<span class="pm-lv ' + level + '">' + I[level] + '<span>' + esc(LV[level]) + '</span></span>'; }
  function osTag(r) { return '<span class="pm-os">' + I[r.k] + '<span>' + esc(r.os) + '</span></span>'; }
  function pend(a, b) {
    var p = PROPOSED[key(a, b)];
    if (!p) return '';
    return '<span class="pm-pend">' + I.clock + '<span>Proposed: ' + esc(LV[p]) + (S.as === 'admin' ? ', waiting for Ed' : ', waiting for you') + '</span></span>';
  }
  function paused(a, b) { return PAUSED[key(a, b)] || (S.as === 'admin' && S.adminPaused && (a === 'ed-mbp' || b === 'ed-mbp')); }
  function pausedTag() { return '<span class="pm-state paused">' + I.pause + '<span>Paused</span></span>'; }
  function announce(t) { document.getElementById('announce').textContent = t; }

  function set(a, b, level) {
    if (S.as === 'admin') { PROPOSED[key(a, b)] = level; S.back = null; announce('Proposed to Ed: ' + nm(a) + ' to ' + nm(b) + ', ' + LV[level] + '.'); render(); return; }
    var before = get(a, b);
    RIGHTS[key(a, b)] = level;
    S.back = (a !== b && canSend(level) && !canSend(before) && !canSend(get(b, a))) ? { a: a, b: b } : null;
    announce(nm(a) + ' to ' + nm(b) + ': ' + LV[level] + '.');
    render();
  }

  /* ---------- chrome ---------- */
  function topBar() {
    return '<header class="top" id="podium-top"><a class="logo" href="#/" aria-label="Podium, fleet">' + I.logo + 'Podium</a>' +

      '<div class="navfoot"><button type="button" class="btn">Lock Admin</button><span class="hint">Locks after 10 minutes without activity.</span></div></div></nav>';

  /* ---------- the owner's sections ---------- */
  function requests() {
    var msg = document.createElement('div');
    return '<section class="asec" aria-labelledby="req-h"><div class="asec-h"><div><h2 id="req-h">Waiting for you</h2>' +
      '<p class="hint">3 requests. Nothing changes until you answer. Each one also shows in your sessions on the machine it concerns, and answering in either place closes the other.</p></div></div>' +

  /* ---------- #436: the owner's stricter limits ---------- */
  // The same rows Admin > Settings draws for the Admin's limits, with a per-key most: the Admin's value.
  var LIMS = [
    { k: 'roundTrips', id: 'lim-trips', label: 'Round trips before a person approves', hint: 'After this many exchanges in one conversation, the next message waits for you to approve it.' },
    { k: 'perMinute', id: 'lim-rate', label: 'Messages per minute on a link', hint: 'More than this is refused, and the sender is told to wait.' },
    { k: 'maxChars', id: 'lim-size', label: 'Longest message, in characters', hint: 'A longer message is refused, never cut, and the sender is told the limit.' }
  ];
  var ADMIN0 = { roundTrips: 10, perMinute: 6, maxChars: 20000 };
  var LIM_CASES = {
    mixed: { admin: {}, own: { perMinute: 3 }, typed: { maxChars: '25000' } },
    admin: { admin: {}, own: {}, typed: {} },
    stricter: { admin: {}, own: { roundTrips: 4, perMinute: 3, maxChars: 8000 }, typed: {} },
    refused: { admin: {}, own: {}, typed: { roundTrips: '15', perMinute: '0', maxChars: '2.5' } },
    lowered: { admin: { roundTrips: 5 }, own: { roundTrips: 8 }, typed: {} }
  };
  var L = null;
  function limCase(name) {
    var c = LIM_CASES[name];
    L = { admin: Object.assign({}, ADMIN0, c.admin), own: Object.assign({}, c.own), typed: {}, err: {} };
    Object.keys(c.typed).forEach(function (k) { check(k, c.typed[k]); });
  }
  function num(n) { return Number(n).toLocaleString('en-US'); }
  function limLabel(k) { for (var i = 0; i < LIMS.length; i++) if (LIMS[i].k === k) return LIMS[i]; return null; }
  // Checks a typed value against 1 and the Admin's value. Saves it, or keeps the text and the reason and saves nothing.
  function check(k, text) {
    var most = L.admin[k], t = String(text).trim(), n = Number(t), tryIt = 'Enter a whole number from 1 to ' + num(most);
    var why = null;
    if (t === '') why = tryIt + '. Nothing was saved.';
    else if (!Number.isFinite(n) || !Number.isInteger(n)) why = t + ' is not a whole number. ' + tryIt + '. Nothing was saved.';
    else if (n < 1) why = num(n) + ' is below 1. ' + tryIt + ', or pause the link under Who can message whom. Nothing was saved.';
    else if (n > most) why = num(n) + ' is above the Admin\'s limit, ' + num(most) + '. ' + tryIt + '. Nothing was saved.';
    if (why) { L.typed[k] = t; L.err[k] = why; return false; }
    delete L.typed[k]; delete L.err[k];
    if (n === most) delete L.own[k]; else L.own[k] = n;
    return true;
  }
  function useAdmin(k) { delete L.own[k]; delete L.typed[k]; delete L.err[k]; }
  function applies(k) { var own = L.own[k], most = L.admin[k]; return own === undefined ? most : Math.min(own, most); }
  function limState(k) {
    var own = L.own[k], most = L.admin[k];
    if (own === undefined) return 'Uses the Admin\'s limit, ' + num(most) + '.';
    if (own < most) return 'Yours, stricter than the Admin\'s limit, ' + num(most) + '.';
    return 'The Admin\'s limit is now ' + num(most) + ', lower than yours, ' + num(own) + ', so ' + num(most) + ' applies.';
  }
  function limRow(m) {
    var k = m.k, bad = !!L.err[k], val = bad ? L.typed[k] : String(applies(k));
    return '<div class="srow"><div class="setname"><label for="' + m.id + '"><b>' + esc(m.label) + '</b></label>' +
      '<p class="hint ink2">' + esc(m.hint) + '</p>' +
      '<div class="row2"><span class="hint" id="' + m.id + '-s">' + esc(limState(k)) + '</span>' +
      (L.own[k] !== undefined ? '<button type="button" class="btn sm" id="' + m.id + '-use" data-lim-use="' + k + '" aria-label="' + esc(m.label) + ': use the Admin\'s limit, ' + num(L.admin[k]) + '">Use the Admin\'s limit</button>' : '') + '</div>' +
      (bad ? '<p class="err" role="alert" id="' + m.id + '-e">' + esc(L.err[k]) + '</p>' : '') + '</div>' +
      '<input class="field mono daysbox" id="' + m.id + '" data-lim-k="' + k + '" type="number" min="1" max="' + L.admin[k] + '" step="1" value="' + esc(val) + '"' +
      ' aria-describedby="' + m.id + '-s' + (bad ? ' ' + m.id + '-e' : '') + '"' + (bad ? ' aria-invalid="true"' : '') + '>' +
      '</div>';
  }
  function limits() {
    return '<div class="mock-new"><span class="mock-cap">New in #436: your limits</span>' + LIMS.map(limRow).join('') + '</div>';

  function render() {
    var active = document.activeElement && document.activeElement.id;

      app.innerHTML = '<div class="adminv" aria-label="Admin"><div class="shell">' + adminNav() + '<div class="apage"><div class="apage-in">' + adminPage() + '</div></div></div></div>';
    } else {
      app.innerHTML = topBar() + '<div class="adminv" aria-label="My reporters"><div class="apage"><div class="apage-in">' + ownerPage() + '</div></div></div>';
    }
    // Text from an agent is set as text, never as HTML; the [redacted] marker is Podium's own and drawn as .rd.
    Array.prototype.forEach.call(app.querySelectorAll('.pm-quote[data-text]'), function (q) {

        if (i > 0) { var r = document.createElement('span'); r.className = 'rd'; r.title = 'Replaced on the sending machine. The original never left it.'; r.textContent = '[redacted]'; q.appendChild(r); }
        q.appendChild(document.createTextNode(part));

  function wire(app) {
    function each(sel, fn) { Array.prototype.forEach.call(app.querySelectorAll(sel), fn); }
    each('select[data-a]', function (s) { s.addEventListener('change', function () { set(s.dataset.a, s.dataset.b, s.value); }); });
    each('select[data-move]', function (s) { s.addEventListener('change', function () { set(S.boardOf, s.dataset.move, s.value); }); });
    each('[data-back]', function (b) { b.addEventListener('click', function () { var v = b.dataset.back; if (v !== 'no') RIGHTS[key(S.back.b, S.back.a)] = v; S.back = null; render(); }); });
    each('[data-seg]', function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.seg === 'boardOf') { S.boardOf = b.dataset.v; S.back = null; render(); return; }
        if (b.dataset.seg === 'view') { S.layout = b.dataset.v; S.back = null; try { localStorage.setItem('podium.peers.view', S.layout); } catch (err) { /* a per-viewer convenience only */ } render(); return; }
        Array.prototype.forEach.call(b.parentNode.children, function (x) { x.setAttribute('aria-checked', String(x === b)); x.tabIndex = x === b ? 0 : -1; });
      });
    });
    // A radio group moves with the arrow keys.
    each('[role="radiogroup"]', function (g) {
      g.addEventListener('keydown', function (e) {
        if (['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].indexOf(e.key) < 0) return;
        var items = Array.prototype.slice.call(g.querySelectorAll('[role="radio"]')), i = items.indexOf(document.activeElement);
        if (i < 0) return;
        var n = items[(i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length];
        n.click(); var f = document.querySelector('[data-seg="' + n.dataset.seg + '"][data-v="' + n.dataset.v + '"]'); if (f) f.focus(); e.preventDefault();
      });
    });
    // #436: a limit is saved when its box loses focus or on Enter; a refused value keeps its text and saves nothing.
    each('input[data-lim-k]', function (f) {
      function commit() {
        var k = f.dataset.limK, m = limLabel(k);
        if (!L.err[k] && f.value === String(applies(k))) return;
        var ok = check(k, f.value);
        announce(ok ? m.label + ': ' + num(applies(k)) + (L.own[k] === undefined ? ', the Admin\'s limit.' : ', yours.') : L.err[k]);
        render();
      }
      f.addEventListener('blur', commit);
      f.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
    });
    each('[data-lim-use]', function (b) {
      b.addEventListener('click', function () {
        var k = b.dataset.limUse, m = limLabel(k);
        useAdmin(k);
        announce(m.label + ': ' + num(L.admin[k]) + ', the Admin\'s limit.');
        render();
        var f = document.getElementById(m.id); if (f) f.focus();
      });
    });
    var tsw = document.getElementById('trust-sw');
    if (tsw) tsw.addEventListener('click', function () { setTrust(!S.trust); });
    var ap = document.getElementById('admin-pause');
    if (ap) ap.addEventListener('click', function () { S.adminPaused = !S.adminPaused; announce(S.adminPaused ? 'Every link on ed-mbp is paused.' : 'Links on ed-mbp resumed.'); render(); });
    // Drag and drop on the board. The Move to list on each card does the same from the keyboard.
    each('.pm-card[draggable="true"]', function (c) {
      c.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', c.dataset.card); c.classList.add('dragging'); });
      c.addEventListener('dragend', function () { c.classList.remove('dragging'); });
    });
    each('.pm-col', function (col) {
      col.addEventListener('dragover', function (e) { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', function () { col.classList.remove('over'); });
      col.addEventListener('drop', function (e) { e.preventDefault(); col.classList.remove('over'); set(S.boardOf, e.dataTransfer.getData('text/plain'), col.dataset.col); });
    });
  }
  function setTrust(on) {
    S.trust = on; S.back = null;
    press('data-trust', on ? 'on' : 'off');
    render();
  }
  var root = document.documentElement;
  function press(attr, v) { Array.prototype.forEach.call(document.querySelectorAll('.demo [' + attr + ']'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute(attr) === v)); }); }
  document.querySelector('.demo').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.as) { S.as = b.dataset.as; S.back = null; press('data-as', S.as); render(); }
    if (b.dataset.trust) setTrust(b.dataset.trust === 'on');
    if (b.dataset['case']) { S.kase = b.dataset['case']; press('data-case', S.kase); render(); }
    if (b.dataset.lim) { S.as = 'owner'; press('data-as', 'owner'); limCase(b.dataset.lim); press('data-lim', b.dataset.lim); render(); }
    if (b.dataset.mode) { root.setAttribute('data-theme', b.dataset.mode); press('data-mode', b.dataset.mode); }
    if (b.dataset.w) {
      var st = document.getElementById('stage');
      st.style.setProperty('--stage', b.dataset.w === 'narrow' ? '400px' : '1240px');
      st.classList.toggle('narrow', b.dataset.w === 'narrow');
      press('data-w', b.dataset.w);
    }
  });
  try { var v = localStorage.getItem('podium.peers.view'); if (v === 'grid' || v === 'board') S.layout = v; } catch (err) { /* private window: start on Grid */ }
  root.setAttribute('data-theme', 'dark');
  limCase('mixed');
  render();
})();
</script>
