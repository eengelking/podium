<title>Podium Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Mockup for #1034: Chat, a console page laid out like Slack or Teams. It replaces Traffic (#347), whose Pause link and
   Remove link move onto each Direct Message as a context menu (right-click, and a "..." button for keyboard and touch).
   Three audiences, three stores, never shown in one list:
     Channels         General (everyone signed in) and My group (the person and their own agents).
     Direct Messages  1-to-1 conversations. The person is a peer: a conversation between two agents, or between the person
                      and one agent. Only the owner and an Admin can read these (#319), the same as Traffic.
     People and agents  the person's own orchestrators, subagents and forks, to start a message with.
   The thread reuses the Activity feed (.feed, .rd): one entry per message, text drawn as text, never as HTML.
   Colors and fonts come from tokens.css through fleet.css; this file has no :root block. Classes that start with ch- are
   new: ch-split (sidebar and thread), ch-side (the sidebar and its sections), ch-row (a sidebar row), ch-menu (the context
   menu), ch-thread (the thread), ch-composer (the message box). Example data only. */
html, body { height: auto; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font-ui); }
.demo { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; background: var(--raised); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--ink2); }
.demo b { color: var(--ink); }
.demo .grp { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.demo button { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font: inherit; font-size: 12px; font-weight: 500; color: var(--ink); cursor: pointer; }
.demo button[aria-pressed="true"] { background: var(--sel); border-color: var(--axis); }
.demo button:focus-visible { outline: 2px solid var(--sonnet); outline-offset: 1px; }
.stage { margin: 0 auto; max-width: var(--stage, 1280px); border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-height: 100vh; background: var(--bg); }
.stage .podium .adminv .apage { overflow: visible; }
.podium .tb-who { margin-right: 8px; }
.stage.narrow .podium .adminv .apage { padding: 16px 16px 0; }

.ch-split { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 560px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
.ch-side { border-right: 1px solid var(--grid); min-width: 0; padding: 8px 0; overflow-y: auto; max-height: 720px; }
.ch-sec { padding: 4px 0 8px; }
.ch-sec > h2 { margin: 0; padding: 6px 20px; font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.ch-list { list-style: none; margin: 0; padding: 0; }
.ch-item { position: relative; display: flex; align-items: center; padding-right: 6px; }
.ch-item:hover { background: var(--hover); }
.ch-item.on { background: var(--sel); }
.podium .ch-row { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 20px; border: 0; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.podium .ch-item.on .ch-row { font-weight: 600; }
.podium .ch-row:focus-visible { outline: 2px solid var(--sonnet); outline-offset: -2px; border-radius: 0; }
.ch-row .ic { flex: none; width: 16px; height: 16px; color: var(--ink2); }
.ch-row .stack { flex: 1; min-width: 0; display: grid; gap: 1px; }
.ch-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-row .sub { font-size: 11px; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-row .tag { font-size: 11px; font-weight: 500; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.ch-row .tag svg { width: 12px; height: 12px; flex: none; }
.ch-row .tag.warn { color: var(--warn-text); }
.ch-row .unread { flex: none; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 650; text-align: center; }
.podium .ch-more { flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink2); cursor: pointer; }
.podium .ch-more:hover { background: var(--hover); border-color: var(--border); }
.ch-more svg { width: 16px; height: 16px; }
.ch-menu { position: absolute; right: 8px; top: 100%; z-index: 10; min-width: 190px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--raised); box-shadow: 0 6px 20px var(--grid); }
.podium .ch-menu button { display: flex; width: 100%; gap: 8px; align-items: center; padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.podium .ch-menu button:hover, .podium .ch-menu button:focus-visible { background: var(--hover); outline: none; }
.podium .ch-menu button:focus-visible { box-shadow: inset 0 0 0 2px var(--sonnet); }
.podium .ch-menu button.dng { color: var(--crit-text); }
.ch-menu svg { width: 14px; height: 14px; flex: none; }
.ch-menu .why { padding: 6px 10px; font-size: 11px; color: var(--muted); }

.ch-thread { min-width: 0; display: flex; flex-direction: column; }
.ch-alert { padding: 10px 16px 0; }
.ch-alert:empty { display: none; }
.ch-head { padding: 12px 16px 8px; border-bottom: 1px solid var(--grid); }
.ch-head h2 { margin: 0; font-size: 15px; font-weight: 650; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ch-head h2 .nm { overflow-wrap: anywhere; }
.ch-head .sub { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12px; }
.ch-who { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px 0; }
.ch-who .m { display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border: 1px solid var(--border); border-radius: 12px; font-size: 12px; color: var(--ink2); }
.ch-who .m svg { width: 12px; height: 12px; }
.ch-body { flex: 1; min-height: 0; overflow-y: auto; max-height: 520px; padding: 8px 16px; }
.ch-earlier { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 8px 0 12px; color: var(--muted); font-size: 12px; }
.ch-body .feed { height: auto; max-height: none; }
.ch-body .feed .body { white-space: pre-wrap; color: var(--ink); overflow-wrap: anywhere; }
.ch-body .feed .who { display: block; font-weight: 600; color: var(--ink); white-space: normal; }
.ch-body .feed .ds { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 11.5px; margin-top: 2px; white-space: normal; }
.ch-body .feed .ds svg { width: 12px; height: 12px; flex: none; }
.ch-body .feed .ds.wait { color: var(--warn-text); }
.ch-body .feed li.mine .body { border-left: 2px solid var(--sonnet); padding-left: 8px; }
.ch-composer { display: grid; gap: 6px; padding: 10px 16px 12px; border-top: 1px solid var(--grid); }
.ch-composer label { font-size: 12px; color: var(--ink2); }
.ch-composer .row { display: flex; gap: 8px; align-items: flex-end; }
.ch-composer textarea { flex: 1; min-height: 44px; resize: vertical; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.ch-composer textarea:focus-visible { outline: 2px solid var(--sonnet); outline-offset: 1px; }
.ch-composer textarea:disabled { color: var(--muted); }
.ch-composer .note { font-size: 12px; color: var(--muted); }
.ch-composer .note.warn { color: var(--warn); }
.ch-body .feed li { position: relative; }
.ch-mention { display: inline-block; padding: 0 5px; border-radius: 4px; background: var(--sel); color: var(--ink); font-weight: 600; }
.ch-body .feed li.reply .body { border-left: 2px solid var(--axis); padding-left: 8px; margin-left: 14px; }
.ch-body .feed .who .re { font-weight: 400; color: var(--muted); }
.ch-st { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.ch-st .s { display: inline-flex; gap: 4px; align-items: center; padding: 1px 8px; border: 1px solid var(--border); border-radius: 10px; font-size: 11.5px; color: var(--ink2); }
.ch-st .s svg { width: 12px; height: 12px; flex: none; }
.ch-st .s.done { color: var(--good-text); }
.ch-st .s.wait { color: var(--warn-text); }
.ch-quote { margin-top: 4px; padding: 4px 8px; border-left: 2px solid var(--axis); color: var(--ink2); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.podium .ch-pick { display: inline-flex; vertical-align: middle; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 8px; border: 1px solid var(--axis); border-radius: 4px; background: transparent; color: var(--bg); }
.podium .ch-pick[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }
.ch-pick svg { width: 11px; height: 11px; }
.ch-pickbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--grid); background: var(--raised); font-size: 12px; }
.ch-pickbar .grow { flex: 1; }
.ch-composer .row { position: relative; }
.ch-ac { position: absolute; left: 0; right: 80px; bottom: 100%; z-index: 12; margin: 0 0 4px; padding: 4px; list-style: none; border: 1px solid var(--border); border-radius: 8px; background: var(--raised); box-shadow: 0 6px 20px var(--grid); max-height: 240px; overflow-y: auto; }
.ch-ac[hidden] { display: none; }
.ch-ac li { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.ch-ac li[aria-selected="true"] { background: var(--sel); }
.ch-ac li[aria-disabled="true"] { color: var(--muted); cursor: default; }
.ch-ac .ic0 { display: inline-flex; align-items: center; min-width: 18px; }
.ch-ac .h { font-weight: 600; }
.ch-ac .r { font-size: 11px; color: var(--muted); }
.ch-ac .off { flex-basis: 100%; font-size: 11px; color: var(--warn-text); }
.podium .si { width: 16px; height: 16px; flex: none; }
.podium .si-running { color: var(--good-text); }
.podium .si-waiting { color: color-mix(in srgb, var(--warn) 60%, var(--ink)); }
.podium .si-bg, .podium .si-deleg { color: var(--deleg-text); }
.podium .si-stale { color: color-mix(in srgb, var(--serious) 60%, var(--ink)); }
.podium .si-done { color: var(--ink2); }
.ch-st .s .si { width: 12px; height: 12px; }
.ch-chipwrap { position: relative; display: inline-flex; }
.podium .ch-chipwrap .m { cursor: pointer; background: transparent; color: var(--ink2); }
.podium .ch-chipwrap .m:hover { background: var(--hover); }
.ch-chipwrap .ch-menu { top: calc(100% + 4px); left: 0; right: auto; min-width: 220px; white-space: nowrap; }
.ch-nav { margin: 0 0 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--raised); font-size: 12px; color: var(--ink2); }
.ch-blank { padding: 40px 24px; text-align: center; color: var(--ink2); }
.ch-thread .ch-back { display: none; }
.stage.narrow .ch-split { grid-template-columns: minmax(0, 1fr); }
.stage.narrow .ch-side { border-right: 0; max-height: none; }
.stage.narrow .ch-split[data-pane="side"] .ch-thread { display: none; }
.stage.narrow .ch-split[data-pane="thread"] .ch-side { display: none; }
.stage.narrow .ch-thread .ch-back { display: inline-flex; justify-self: start; margin: 8px 16px 0; }
@media (max-width: 760px) {
  .ch-split { grid-template-columns: minmax(0, 1fr); }
  .ch-side { border-right: 0; max-height: none; }
}
</style>

<div class="demo" role="toolbar" aria-label="Mockup controls">
  <b>Chat (#1034)</b>
  <span class="grp" role="group" aria-label="Viewer">Viewer
    <button type="button" data-viewer="owner" aria-pressed="true">Ed, signed in</button>
    <button type="button" data-viewer="admin" aria-pressed="false">Admin</button>
    <button type="button" data-viewer="other" aria-pressed="false">Another person</button>
  </span>
  <span class="grp" role="group" aria-label="Case">Case
    <button type="button" data-case="full" aria-pressed="true">Busy</button>
    <button type="button" data-case="empty" aria-pressed="false">Nothing yet</button>
    <button type="button" data-case="error" aria-pressed="false">Send failed</button>
    <button type="button" data-case="long" aria-pressed="false">Long names</button>
  </span>
  <span class="grp" role="group" aria-label="@group and @everyone">@group, @everyone
    <button type="button" data-groupat="off" aria-pressed="true">Off</button>
    <button type="button" data-groupat="on" aria-pressed="false">On (Admin turned on)</button>
  </span>
  <span class="grp" role="group" aria-label="Sessions">Sessions
    <button type="button" data-end="infra-notes,Tester" aria-pressed="false">End infra-notes and Tester</button>
    <button type="button" data-end="Tester" aria-pressed="false">End Tester only</button>
  </span>
  <span class="grp" role="group" aria-label="Mode">Mode
    <button type="button" data-mode="dark" aria-pressed="true">Dark</button>
    <button type="button" data-mode="light" aria-pressed="false">Light</button>
  </span>
  <span class="grp" role="group" aria-label="Width">Width
    <button type="button" data-w="wide" aria-pressed="true">Wide</button>
    <button type="button" data-w="narrow" aria-pressed="false">400 px</button>
  </span>
</div>

<div class="stage" id="stage"><div class="podium" id="app"></div></div>
<div class="vh" role="status" aria-live="polite" id="announce"></div>

<script>

      var li = document.createElement('li'); li.className = 'txt' + (m.me ? ' mine' : '') + (m.re ? ' reply' : '');
      var at = document.createElement('span'); at.className = 'at'; at.textContent = m.t; li.appendChild(at);
      var k = document.createElement('span'); k.className = 'k'; k.setAttribute('role', 'img'); k.setAttribute('aria-label', 'Message'); k.title = 'Message'; k.innerHTML = I.msg; li.appendChild(k);
      var body = document.createElement('span'); body.className = 'body';
      var who = document.createElement('span'); who.className = 'who' + (m.me ? ' me' : ''); who.textContent = m.me ? 'You' : nm(m.f);
      if (m.re) { var re = document.createElement('span'); re.className = 're'; re.textContent = ' replying to ' + m.re; who.appendChild(re); }
      var pk = document.createElement('button'); pk.type = 'button'; pk.className = 'ch-pick'; pk.setAttribute('aria-pressed', String(picked)); pk.setAttribute('aria-label', 'Select the message from ' + (m.me ? 'you' : nm(m.f)) + ' at ' + m.t); pk.dataset.pick = key; pk.innerHTML = I.ok; who.appendChild(pk);
      body.appendChild(who);
      addText(body, m.tx);
      if (m.quote) { var q = document.createElement('div'); q.className = 'ch-quote'; q.textContent = m.quote.join('\n'); body.appendChild(q); }
      if (m.st) {
        var st = document.createElement('div'); st.className = 'ch-st';
        m.st.forEach(function (p) { var sp = document.createElement('span'); sp.className = 's ' + (p[1] === 'done' ? 'done' : p[1] === 'waiting' ? 'wait' : ''); sp.innerHTML = p[1] === 'done' ? si('done') : p[1] === 'waiting' ? I.clock : si('running'); var w = document.createElement('span'); w.textContent = p[0] + ' ' + p[1]; sp.appendChild(w); st.appendChild(sp); });
        body.appendChild(st);
      }
      var ds = document.createElement('span'); ds.className = 'ds' + (m.ds[0] === 'clock' || m.ds[0] === 'pause' || m.ds[0] === 'queue' ? ' wait' : '');
      ds.innerHTML = I[m.ds[0]]; var dt = document.createElement('span'); dt.textContent = m.ds[1]; ds.appendChild(dt); body.appendChild(ds);
      li.appendChild(body);
      li.addEventListener('contextmenu', function (e) { e.preventDefault(); S.pick[key] = true; S.msgMenu = key; S.keep = document.querySelector('.ch-body').scrollTop; render(); });
      if (S.msgMenu === key) { var mn = document.createElement('div'); mn.className = 'ch-menu'; mn.setAttribute('role', 'menu'); mn.setAttribute('aria-label', 'Actions for the selected messages'); mn.innerHTML = '<button type="button" role="menuitem" data-act="pick-send">' + I.msg + 'Send selected to an agent…</button><button type="button" role="menuitem" data-act="pick-clear">' + I.ok + 'Clear selection</button>'; li.appendChild(mn); }
      ol.appendChild(li);
    });
    // Newest at the bottom: open a thread, or send, and the newest message is in view. Selecting keeps the place.
    var bd = document.querySelector('.ch-body'); if (bd && !S.earlier) bd.scrollTop = S.keep != null ? S.keep : bd.scrollHeight; S.keep = null;
  }

  function page() {
    var head = '<div class="page-h"><div><h1>Chat</h1><p class="lead">Talk with your orchestrators and subagents, read what they say to each other, and join in.</p></div></div>';
    return head + (S.nav ? '<div class="ch-nav" role="status">' + esc(S.nav) + '</div>' : '') + '<section class="asec" aria-label="Chat"><div class="ch-split" data-pane="' + S.pane + '">' + sidebar() + thread() + '</div></section>' +
      '<section class="asec" aria-labelledby="rules-h"><div class="asec-h"><div><h2 id="rules-h">Who can read what</h2></div></div><div class="panel"><ul class="plain">' +
      '<li><b>General</b> is read and written by everyone signed in to this server.</li>' +
      '<li><b>My group</b> is you and your own orchestrators, subagents and forks. No one else sees it.</li>' +
      '<li><b>Direct Messages</b> are read only by you and an Admin. A conversation between two agents shows you as the third person in it, and you can add to it. Delete conversation removes one from your list. One also goes away on its own once every agent session in it has ended or disconnected from Podium.</li>' +
      '<li>An agent only acts in a channel when it is <b>@-addressed</b>: <b>name@location</b> for one agent or person. <b>@group</b> and <b>@everyone</b> are off until an Admin turns them on. Each addressed agent posts a reply saying what it is doing and, when done, a report. Agents addressing each other stop at 10 round trips until its owner approves the next. What an agent may do is still set by its reporter\'s permissions.</li>' +
      '<li>The menu on a channel is the stop button for a runaway session: <b>Pause</b> holds messages and keeps access, <b>Disconnect</b> takes your agents\' access away, <b>Remove all messages</b> deletes the history. Anyone can stop their own agents in General. Only an Admin can pause General for everyone or remove its messages.</li>' +
      '<li>Pause link stops delivery at once and keeps the rights. Remove link takes every right away, in both directions. Both are in the menu on each Direct Message.</li></ul></div></section>';
  }

  function render() {
    var tb = document.getElementById('msg'); if (tb) S.draft = tb.value;
    var active = document.activeElement && document.activeElement.id;
    var app = document.getElementById('app');
    app.innerHTML = topBar() + '<div class="adminv" aria-label="Chat"><div class="apage"><div class="apage-in">' + page() + '</div></div></div>';
    fillFeed(); wire(app);
    if (active) { var el = document.getElementById(active); if (el) el.focus(); }
  }
  function open(id) { var tb = document.getElementById('msg'); if (tb) tb.value = ''; S.sel = id; S.menu = null; S.removing = false; S.clearing = false; S.deleting = false; S.sendErr = false; S.earlier = false; S.draft = ''; S.pane = 'thread'; var x = item(id); if (x && x.unread) x.unread = 0; if (x && x.ment) x.ment = 0; S.pick = {}; S.msgMenu = null; S.sendTo = false; S.errText = ''; render(); announce('Showing ' + (isDm(x) ? 'the conversation ' + dmName(x) : x.name) + '.'); var h = document.getElementById('th-h'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } }
  function wire(app) {
    function each(sel, fn) { Array.prototype.forEach.call(app.querySelectorAll(sel), fn); }
    each('[data-open]', function (b) { b.addEventListener('click', function () { open(b.dataset.open); }); });
    each('[data-back]', function (b) { b.addEventListener('click', function () { S.pane = 'side'; render(); }); });
    each('[data-earlier]', function (b) { b.addEventListener('click', function () { S.earlier = true; render(); announce('Earlier messages loaded.'); }); });
    each('[data-person]', function (b) { b.addEventListener('click', function () { announce('Starting a message with ' + b.dataset.person + '.'); S.sel = 'd3'; S.pane = 'thread'; render(); }); });
    each('[data-more]', function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); S.menu = S.menu === b.dataset.more ? null : b.dataset.more; render(); var f = app.querySelector('[data-more="' + b.dataset.more + '"]'); if (S.menu) { var mi = app.querySelector('.ch-menu button'); if (mi) mi.focus(); } else if (f) f.focus(); }); });
    each('[data-ctx]', function (li) { li.addEventListener('contextmenu', function (e) { e.preventDefault(); S.menu = li.dataset.ctx; render(); var mi = app.querySelector('.ch-menu button'); if (mi) mi.focus(); }); });
    each('.ch-menu', function (m) { m.addEventListener('keydown', function (e) {
      var items = Array.prototype.slice.call(m.querySelectorAll('button')), i = items.indexOf(document.activeElement);
      if (e.key === 'Escape') { var id = S.menu; S.menu = null; render(); var f = app.querySelector('[data-more="' + id + '"]'); if (f) f.focus(); }
      if (e.key === 'ArrowDown' && items.length) { items[(i + 1) % items.length].focus(); e.preventDefault(); }
      if (e.key === 'ArrowUp' && items.length) { items[(i + items.length - 1) % items.length].focus(); e.preventDefault(); }
    }); });
    each('[data-act]', function (b) { b.addEventListener('click', function () {
      var d = item(b.dataset.id || S.sel), a = b.dataset.act;
      if (a === 'goto') { S.menu = null; S.nav = 'In the app this opens the orchestration page for ' + nm(b.dataset.id) + ' (the fleet console, #/?open=' + b.dataset.id + '). The mockup stays here.'; render(); announce(S.nav); return; }
      if (a === 'person-msg') { S.menu = null; S.nav = ''; S.sel = 'd3'; S.pane = 'thread'; render(); announce('Starting a message with ' + nm(b.dataset.id) + '.'); return; }
      if (a === 'cclear-keep' || a === 'ddel-keep' || a === 'pick-send' || a === 'pick-clear') d = item(S.sel);
      if (a === 'pause') { d.st = d.st === 'paused' ? 'active' : 'paused'; S.menu = null; announce(d.st === 'paused' ? 'Link paused.' : 'Link resumed.'); }
      if (a === 'remove') { S.sel = d.id; S.menu = null; S.removing = true; }
      if (a === 'pick-send') { S.sendTo = true; S.msgMenu = null; S.keep = document.querySelector('.ch-body').scrollTop; }
      if (a === 'pick-clear') { S.pick = {}; S.sendTo = false; S.msgMenu = null; S.keep = document.querySelector('.ch-body').scrollTop; }
      if (a === 'keep') S.removing = false;
      if (a === 'ddel') { S.sel = d.id; S.menu = null; S.deleting = true; }
      if (a === 'ddel-keep') S.deleting = false;
      if (a === 'ddel-go') { S.deleting = false; DMS.splice(DMS.indexOf(d), 1); S.sel = 'c-gen'; announce('Conversation deleted.'); }
      if (a === 'cpause') { d.st = d.st === 'paused' && !d.all ? 'active' : 'paused'; d.all = false; S.menu = null; announce(d.st === 'paused' ? 'Paused.' : 'Resumed.'); }
      if (a === 'cpause-all') { d.all = !d.all; d.st = d.all ? 'paused' : 'active'; S.menu = null; announce(d.all ? 'General is paused for everyone.' : 'General resumed.'); }
      if (a === 'cdisc') { d.off = !d.off; S.menu = null; announce(d.off ? 'Your agents are disconnected.' : 'Your agents are reconnected.'); }
      if (a === 'cclear') { S.sel = d.id; S.menu = null; S.clearing = true; }
      if (a === 'cclear-keep') S.clearing = false;
      if (a === 'cclear-go') { d.msgs = []; d.n = 0; S.clearing = false; announce('All messages removed.'); }
      if (a === 'remove-go') { S.removing = false; d.st = 'removed'; announce('Link removed. The conversation stays until you delete it or it expires.'); }
      render();
    }); });
    each('#msg', function (t) {
      var ac = document.getElementById('ac'), st = { items: [], i: 0, from: 0, to: 0 };
      function close() { ac.hidden = true; t.setAttribute('aria-expanded', 'false'); t.removeAttribute('aria-activedescendant'); st.items = []; }
      function paint() {
        ac.innerHTML = st.items.map(function (a, n) {
          var off = a.special && !S.groupAt;
          return '<li role="option" id="ac-' + n + '" data-n="' + n + '" aria-selected="' + (n === st.i) + '"' + (off ? ' aria-disabled="true"' : '') + '><span class="ic0">' + (a.agent ? si(stateOf(a.h.split('@')[0])) : a.special ? '' : mono(a.h.split('@')[0])) + '</span><span class="h">@' + esc(a.h) + '</span><span class="r">' + esc(a.r) + '</span>' + (off ? '<span class="off">Off. An Admin turns @' + esc(a.h) + ' on in Admin &gt; Settings.</span>' : '') + '</li>';
        }).join('');
        ac.hidden = false; t.setAttribute('aria-expanded', 'true'); t.setAttribute('aria-activedescendant', 'ac-' + st.i);
        Array.prototype.forEach.call(ac.querySelectorAll('li'), function (li) { li.addEventListener('mousedown', function (e) { e.preventDefault(); pickIt(Number(li.dataset.n)); }); });
      }
      function pickIt(n) {
        var a = st.items[n]; if (!a || (a.special && !S.groupAt)) return;
        var ins = '@' + a.h + ' '; t.value = t.value.slice(0, st.from) + ins + t.value.slice(st.to);
        t.selectionStart = t.selectionEnd = st.from + ins.length; close(); t.focus();
      }
      function update() {
        var before = t.value.slice(0, t.selectionStart), m = /(^|\s)@([^\s]*)$/.exec(before);
        if (!m) { close(); return; }
        var q = m[2].toLowerCase(); st.from = before.length - m[2].length - 1; st.to = before.length;
        st.items = ATS.filter(function (a) { return a.h.toLowerCase().indexOf(q) === 0; });
        if (!st.items.length) { close(); return; }
        st.i = Math.min(st.i, st.items.length - 1); paint();
      }
      t.addEventListener('input', function () { st.i = 0; update(); });
      t.addEventListener('blur', close);
      t.addEventListener('keydown', function (e) {
        if (!ac.hidden) {
          if (e.key === 'ArrowDown') { st.i = (st.i + 1) % st.items.length; paint(); e.preventDefault(); return; }
          if (e.key === 'ArrowUp') { st.i = (st.i + st.items.length - 1) % st.items.length; paint(); e.preventDefault(); return; }
          if (e.key === 'Escape') { close(); e.preventDefault(); return; }
          if ((e.key === 'Enter' || e.key === 'Tab') && !e.shiftKey && !e.isComposing) { pickIt(st.i); e.preventDefault(); return; }
        }
        // Enter sends. Shift+Enter adds a line. A key press that is choosing an IME character is left alone.
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); var b = app.querySelector('[data-send]'); if (b && !b.disabled) b.click(); }
      });
    });
    each('[data-pick]', function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); var k = b.dataset.pick; if (S.pick[k]) delete S.pick[k]; else S.pick[k] = true; if (!Object.keys(S.pick).length) S.sendTo = false; S.msgMenu = null; S.keep = document.querySelector('.ch-body').scrollTop; render(); }); });
    each('[data-sendto]', function (b) { b.addEventListener('click', function () {
      var x = item(S.sel), keys = Object.keys(S.pick);
      var quotes = x.msgs.filter(function (m) { return S.pick[keyOf(m)]; }).map(function (m) { return (m.me ? 'You' : nm(m.f)) + ' (' + m.t + '): ' + m.tx; });
      x.msgs.push({ f: 'Ed', me: true, t: 'Mon 14:40', ds: ['queue', 'Waiting: it reaches ' + b.dataset.sendto + ' when its current turn ends.'], tx: '@' + b.dataset.sendto + ' please look at the ' + keys.length + ' message' + (keys.length > 1 ? 's' : '') + ' below and act on ' + (keys.length > 1 ? 'them' : 'it') + ', then report back here.', quote: quotes, st: [[b.dataset.sendto, 'waiting']] });
      x.n += 1; S.pick = {}; S.sendTo = false; S.msgMenu = null; render(); announce('Sent to ' + b.dataset.sendto + '.');
    }); });
    each('[data-send]', function (b) { b.addEventListener('click', function () {
      var t = document.getElementById('msg'); S.draft = t.value;
      if (S.kase === 'error') { S.sendErr = true; render(); return; }
      if (!t.value.trim()) return;
      var x = item(S.sel);
      var ment = t.value.match(/@[A-Za-z0-9._-]+@[A-Za-z0-9._-]+|@group\b|@everyone\b/g) || [];
      if (!S.groupAt && ment.some(function (m) { return m === '@group' || m === '@everyone'; })) { S.sendErr = true; S.errText = '@group and @everyone are off, so nothing was sent. An Admin turns them on in Admin > Settings. Address one agent as name@location instead.'; render(); return; }
      var agents = ment.map(function (m) { return m.slice(1); }).filter(function (h) { return ATS.some(function (a) { return a.h === h && a.agent; }); });
      var mine = { f: 'Ed', me: true, t: 'Mon 14:20', ds: isDm(x) ? ['queue', 'Waiting: it reaches each agent when its current turn ends.'] : agents.length ? ['queue', 'Waiting: ' + agents.join(' and ') + ' get this when their current turn ends.'] : ['ok', ment.length ? 'Posted. ' + ment.map(function (m) { return m.slice(1).split('@')[0]; }).join(' and ') + ' was notified.' : 'Posted. No agent was addressed, so none will act on it.'], tx: t.value };
      if (!isDm(x) && agents.length) mine.st = agents.map(function (h) { return [h, 'waiting']; });
      x.msgs.push(mine);
      x.n += 1; t.value = ''; S.draft = ''; S.sendErr = false; S.errText = ''; render(); announce('Message sent.');
    }); });
    app.addEventListener('click', function (e) { if ((S.menu || S.msgMenu) && !e.target.closest('.ch-menu, .ch-more')) { S.menu = null; S.msgMenu = null; render(); } }, { once: true });
  }
  var root = document.documentElement;
  function press(attr, v) { Array.prototype.forEach.call(document.querySelectorAll('.demo [' + attr + ']'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute(attr) === v)); }); }
  document.querySelector('.demo').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.viewer) { S.viewer = b.dataset.viewer; if (S.viewer === 'other' && (isDm(item(S.sel)) || item(S.sel).kind === 'group')) S.sel = 'c-gen'; press('data-viewer', S.viewer); render(); }
    if (b.dataset['case']) { S.kase = b.dataset['case']; S.sendErr = false; press('data-case', S.kase); render(); }
    if (b.dataset.groupat) { S.groupAt = b.dataset.groupat === 'on'; press('data-groupat', b.dataset.groupat); render(); }
    if (b.dataset.end) {
      var names = b.dataset.end.split(','), on = b.getAttribute('aria-pressed') !== 'true';
      GONE = {}; Array.prototype.forEach.call(document.querySelectorAll('.demo [data-end]'), function (x) { x.setAttribute('aria-pressed', 'false'); });
      if (on) { names.forEach(function (n) { GONE[n] = true; }); b.setAttribute('aria-pressed', 'true'); }
      if (!item(S.sel)) S.sel = 'c-gen';
      render(); announce(on ? names.join(' and ') + ' ended. A conversation with no live agent left is removed from the list.' : 'Sessions restored.');
    }
    if (b.dataset.mode) { root.setAttribute('data-theme', b.dataset.mode); press('data-mode', b.dataset.mode); }
    if (b.dataset.w) {
      var st = document.getElementById('stage');
      st.style.setProperty('--stage', b.dataset.w === 'narrow' ? '400px' : '1280px');
      st.classList.toggle('narrow', b.dataset.w === 'narrow');
      S.pane = b.dataset.w === 'narrow' ? 'side' : 'thread';
      press('data-w', b.dataset.w); render();
    }
  });
  root.setAttribute('data-theme', 'dark');
  S.pane = 'thread';
  render();
})();
</script>
